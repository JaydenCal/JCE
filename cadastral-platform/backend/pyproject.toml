[project]
name = "cadastral-platform-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "psycopg[binary,pool]>=3.1",
  "numpy>=1.26", "scipy>=1.12", "shapely>=2.0", "pyproj>=3.6", "ezdxf>=1.3",
  "pypdf>=4.0", "pdfplumber>=0.11", "opencv-python-headless>=4.9", "pymupdf>=1.24",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "reportlab>=4"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
