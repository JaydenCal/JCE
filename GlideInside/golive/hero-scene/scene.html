<script>
// Glide Inside hero scene: generic single storey 4 bedroom on a 40 x 50 m rural residential lot.
THREE.ColorManagement.legacyMode=false;
const Q=new URLSearchParams(location.search);
const VW=+Q.get('w')||1600,VH=+Q.get('h')||900;
let seed=+(Q.get('seed')||7);function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
const R=(a,b)=>a+(b-a)*rnd();
const LOT_W=40,LOT_D=50,W2=20,D2=25,VERGE=4.5,ROAD=9,FP=1.5;
const kerbZ=D2+VERGE,roadZ0=kerbZ+0.45,roadZ1=roadZ0+ROAD,roadC=(roadZ0+roadZ1)/2;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(VW,VH);document.body.appendChild(renderer.domElement);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=+(Q.get('exp')||0.92);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(+(Q.get('fov')||30),VW/VH,1,4000);

// ---------- sky and haze
const HOR=new THREE.Color().setRGB(0.86,0.74,0.60),ZEN=new THREE.Color().setRGB(0.22,0.36,0.62);
const sunAz=+(Q.get('az')||-72)*Math.PI/180,sunEl=+(Q.get('el')||24)*Math.PI/180;
const SUNV=new THREE.Vector3(Math.sin(sunAz)*Math.cos(sunEl),Math.sin(sunEl),Math.cos(sunAz)*Math.cos(sunEl));
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{sunDir:{value:SUNV},zenith:{value:ZEN},horizon:{value:HOR}},
 vertexShader:'varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
 fragmentShader:'uniform vec3 sunDir;uniform vec3 zenith;uniform vec3 horizon;varying vec3 vDir;void main(){vec3 d=normalize(vDir);float h=max(d.y,0.0);vec3 col=mix(horizon,zenith,smoothstep(0.0,0.5,h));float mu=max(dot(d,sunDir),0.0);col+=vec3(1.0,0.75,0.45)*pow(mu,8.0)*0.35;if(d.y<0.0)col=horizon;gl_FragColor=vec4(col,1.0);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(2500,32,16),skyMat);scene.add(sky);
const HAZE=new THREE.Color().setRGB(0.80,0.71,0.60);
scene.fog=new THREE.Fog(HAZE,+(Q.get('fn')||170),+(Q.get('ff')||900));

// environment map for the standard materials
{const es=new THREE.Scene();const em=new THREE.Mesh(new THREE.SphereGeometry(100,32,16),skyMat.clone());es.add(em);const pm=new THREE.PMREMGenerator(renderer);window.ENV=pm.fromScene(es,0.04).texture}

const hemi=new THREE.HemisphereLight(0xdfe8ff,0x8a7a5c,+(Q.get('hemi')||0.75));scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe0b8,+(Q.get('sun')||2.1));sun.position.copy(SUNV).multiplyScalar(220);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-95,right:95,top:95,bottom:-95,near:20,far:520});sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.04;sun.shadow.radius=3;
sun.target.position.set(0,0,10);scene.add(sun);scene.add(sun.target);

// ---------- helpers
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=16;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);return t}
function speckle(g,w,h,n,amp,sz){for(let i=0;i<n;i++){const v=(rnd()-.5)*amp;g.fillStyle=v>0?'rgba(255,250,235,'+v+')':'rgba(20,18,10,'+(-v)+')';const s=(sz||1.5)*(0.5+rnd());g.fillRect(rnd()*w,rnd()*h,s,s)}}
function blotch(g,w,h,n,cols,rmin,rmax,a){for(let i=0;i<n;i++){const x=rnd()*w,y=rnd()*h,r=R(rmin,rmax);const gr=g.createRadialGradient(x,y,0,x,y,r);const c=cols[(rnd()*cols.length)|0];gr.addColorStop(0,'rgba('+c+','+a+')');gr.addColorStop(1,'rgba('+c+',0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}}
const std=(o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:0.9,metalness:0},o));
function add(m,cast,recv){m.castShadow=!!cast;m.receiveShadow=recv!==false;scene.add(m);return m}
function boxM(w,h,d,mat,x,y,z,cast){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);return add(m,cast)}
function flat(w,d,mat,x,y,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);m.rotation.x=-Math.PI/2;if(ry)m.rotation.z=ry;m.position.set(x,y,z);return add(m,false)}

// ---------- aerial ground (procedural paddock orthophoto), 720 m square
const GA=720,GPX=4096,mpp=GA/GPX;
const W2P=(x,z)=>[(x+GA/2)/mpp,(z+GA/2)/mpp];
const clumps=[];// 3D tree positions near the lot
const shadowOff=[-SUNV.x/SUNV.y,-SUNV.z/SUNV.y];
function blotchAll(g,w,h){for(let i=0;i<5000;i++){const x=rnd()*w,y=rnd()*h,r=R(6,40);const gr=g.createRadialGradient(x,y,0,x,y,r);const dark=rnd()<0.55;gr.addColorStop(0,dark?'rgba(55,60,30,0.16)':'rgba(215,200,150,0.12)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}}
const aerial=canvasTex(GPX,GPX,(g,w,h)=>{
 g.fillStyle='#78764f';g.fillRect(0,0,w,h);
 // paddocks: recursive split aligned to the road
 const pal=['#7d7a55','#6f7349','#626c42','#8a8462','#736f4f','#6c774a','#58663d','#938a6c','#7a7d52','#55623b','#868062','#506039','#677249','#8c8f6a'];
 function split(x0,z0,x1,z1,d){const W=x1-x0,D=z1-z0;if(d>4||(W<110&&D<110&&rnd()<0.6)||W<45||D<45){paddock(x0,z0,x1,z1);return}
  if(W>D){const s=x0+W*R(0.35,0.65);split(x0,z0,s,z1,d+1);split(s,z0,x1,z1,d+1)}else{const s=z0+D*R(0.35,0.65);split(x0,z0,x1,s,d+1);split(x0,s,x1,z1,d+1)}}
 function paddock(x0,z0,x1,z1){const [a,b]=W2P(x0,z0),[c,d]=W2P(x1,z1);g.fillStyle=pal[(rnd()*pal.length)|0];g.fillRect(a,b,c-a,d-b);
  g.save();g.beginPath();g.rect(a,b,c-a,d-b);g.clip();
  // mottling
  blotch(g,0,0,0,[],1,1,0);
  const n=Math.round((c-a)*(d-b)/900);for(let i=0;i<n;i++){const x=R(a,c),y=R(b,d),r=R(12,60);const gr=g.createRadialGradient(x,y,0,x,y,r);const dark=rnd()<0.5;gr.addColorStop(0,dark?'rgba(60,70,30,0.10)':'rgba(220,205,160,0.10)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
  // cultivation / mowing streaks
  if(rnd()<0.55){const vert=rnd()<0.5;g.globalAlpha=R(0.04,0.10);g.fillStyle=rnd()<0.5?'#5f5a36':'#e4d8a8';const step=R(3,7);if(vert)for(let x=a;x<c;x+=step)g.fillRect(x,b,step*0.45,d-b);else for(let y=b;y<d;y+=step)g.fillRect(a,y,c-a,step*0.45);g.globalAlpha=1}
  // stock tracks
  if(rnd()<0.5){g.strokeStyle='rgba(210,190,140,0.35)';g.lineWidth=R(1.5,3);g.beginPath();let x=R(a,c),y=b;g.moveTo(x,y);while(y<d){x+=R(-8,8);y+=R(10,20);g.lineTo(x,y)}g.stroke()}
  g.restore();
  // fence line
  g.strokeStyle='rgba(70,62,40,0.45)';g.lineWidth=1.2;g.strokeRect(a,b,c-a,d-b);
  // trees along some fence lines
  if(rnd()<0.6){const side=(rnd()*4)|0;const L=side%2?d-b:c-a;const cnt=Math.round(L/R(14,40));for(let i=0;i<cnt;i++){const t=rnd();const px=side==0?a+t*(c-a):side==1?c:side==2?a+t*(c-a):a;const py=side==0?b:side==1?b+t*(d-b):side==2?d:b+t*(d-b);
    const wx=px*mpp-GA/2,wz=py*mpp-GA/2;treeDot(wx,wz,R(2.5,5))}}
  // scattered paddock trees
  const k=(rnd()<0.6?2:0)+(rnd()<0.35?4:0);for(let i=0;i<k;i++){const wx=R(x0+5,x1-5),wz=R(z0+5,z1-5);treeDot(wx,wz,R(3.5,6.5))}
  // a dam
  if(rnd()<0.12){const cx=R(a+20,c-20),cy=R(b+20,d-20),r=R(10,22);g.fillStyle='#6d6a4a';g.beginPath();g.ellipse(cx,cy,r*1.25,r,R(0,3),0,7);g.fill();g.fillStyle='#4f5a4a';g.beginPath();g.ellipse(cx,cy,r*0.95,r*0.75,R(0,3),0,7);g.fill()}
  // a farm house and shed
  if(rnd()<0.10&&(c-a)>80&&(d-b)>80){const hx=R(x0+15,x1-25),hz=R(z0+15,z1-25);farm(hx,hz)}
 }
 function treeDot(wx,wz,r){if(Math.abs(wx)<75&&wz>-70&&wz<roadZ1+40)return;// near the lot: real trees only
  const near=Math.hypot(wx,wz-5)<230;if(near&&rnd()<0.85){clumps.push([wx,wz,r]);return}
  const [px,py]=W2P(wx,wz),pr=r/mpp;
  g.fillStyle='rgba(30,30,18,0.45)';g.beginPath();g.ellipse(px+shadowOff[0]*pr*1.6,py+shadowOff[1]*pr*1.6,pr*1.05,pr*0.95,0,0,7);g.fill();
  for(let i=0;i<6;i++){const ox=R(-.45,.45)*pr,oy=R(-.45,.45)*pr,rr=pr*R(0.45,0.7);g.fillStyle=['#3c4a2a','#46552f','#53613a','#35422a'][i%4];g.beginPath();g.arc(px+ox,py+oy,rr,0,7);g.fill()}
  g.fillStyle='rgba(150,160,110,0.25)';g.beginPath();g.arc(px-pr*0.25,py-pr*0.25,pr*0.35,0,7);g.fill()}
 function farm(x,z){const [px,py]=W2P(x,z);const w=R(14,20)/mpp,d=R(9,13)/mpp;g.fillStyle='rgba(30,28,20,0.45)';g.fillRect(px+shadowOff[0]*12,py+shadowOff[1]*12,w,d);g.fillStyle=['#8d9092','#b9b6ae','#6f7377'][(rnd()*3)|0];g.fillRect(px,py,w,d);g.fillStyle='rgba(255,255,255,0.12)';g.fillRect(px,py,w,d/2);
  const sx=px+w+R(10,25)/mpp,sw=R(12,18)/mpp,sd=R(8,12)/mpp;g.fillStyle='rgba(30,28,20,0.45)';g.fillRect(sx+shadowOff[0]*10,py+shadowOff[1]*10,sw,sd);g.fillStyle='#c7c8c4';g.fillRect(sx,py,sw,sd);
  g.strokeStyle='rgba(200,185,140,0.7)';g.lineWidth=3;g.beginPath();g.moveTo(px+w/2,py+d);g.lineTo(px+w/2+R(-30,30),W2P(0,roadZ0)[1]);g.stroke()}
 // north side of the road (behind the lot)
 split(-GA/2,-GA/2,GA/2,-D2-50,0);
 // the residential strip either side of our lot behind the street (rural residential lots, 40 m wide)
 split(-GA/2,-D2-50,-W2-120,kerbZ,1);split(W2+120,-D2-50,GA/2,kerbZ,1);
 // south side of the road
 split(-GA/2,roadZ1+0.5+VERGE+50,GA/2,GA/2,0);

 // a creek line with dense trees across the back paddocks
 {let x=-GA/2,z=-230;while(x<GA/2){x+=R(4,8);z+=R(-4,4);z=Math.max(-300,Math.min(-140,z));for(let i=0;i<2;i++)treeDot(x+R(-6,6),z+R(-10,10),R(3,6))}}
 // general grain
 blotchAll(g,w,h);speckle(g,w,h,1400000,0.20,1.6);speckle(g,w,h,300000,0.12,4);
},null);
aerial.wrapS=aerial.wrapT=THREE.ClampToEdgeWrapping;
const ground=flat(GA,GA,std({map:aerial,roughness:1}),0,-0.06,0);
// beyond the aerial: a fogged plain
flat(5000,5000,std({color:0x9c936c,roughness:1}),0,-0.2,0);

// ---------- grass textures
const grassTex=(base,stripe)=>canvasTex(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
 blotch(g,w,h,60,['70,85,40','160,150,95','95,110,55'],20,70,0.18);
 if(stripe){for(let i=0;i<4;i++){g.fillStyle=i%2?'rgba(255,255,230,0.025)':'rgba(30,40,10,0.025)';g.fillRect(i*128,0,128,h)}}
 for(let i=0;i<70000;i++){const v=rnd();g.fillStyle=v<0.5?'rgba(40,55,20,'+(0.10+rnd()*0.15)+')':v<0.85?'rgba(190,195,130,'+(0.08+rnd()*0.12)+')':'rgba(170,150,95,0.18)';g.fillRect(rnd()*w,rnd()*h,1,1+rnd()*2)}});
const tLawn=grassTex('#5e6a3c',true),tPad=grassTex('#727049',false),tVerge=grassTex('#66703f',false);
const lawnMat=std({map:tLawn}),padMat=std({map:tPad}),vergeMat=std({map:tVerge});
tLawn.repeat.set(LOT_W/16,LOT_D/16);tPad.repeat.set(10,10);tVerge.repeat.set(30,0.6);

// ---------- street: footpath, kerb and gutter, road with line marking
const asphTex=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#3a3b3d';g.fillRect(0,0,w,h);blotch(g,w,h,80,['20,20,22','90,88,84'],30,120,0.18);speckle(g,w,h,260000,0.30,1.6)});asphTex.repeat.set(40,1.2);
const concTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#b9b5ac';g.fillRect(0,0,w,h);blotch(g,w,h,40,['150,145,135','235,232,225'],20,80,0.2);speckle(g,w,h,40000,0.12,1.4)});
const RL=760;
flat(RL,VERGE,vergeMat,0,0.0,D2+VERGE/2);
{const t=concTex.clone();t.needsUpdate=true;t.repeat.set(RL/3,0.6);flat(RL,FP,std({map:t}),0,0.02,D2+1.1)}
// footpath joints
for(let x=-RL/2;x<RL/2;x+=1.8)boxM(0.03,0.005,FP,std({color:0x9c988e}),x,0.025,D2+1.1);
function kerb(z,dir){// roll kerb profile extruded along x
 const s=new THREE.Shape();const p=[[0,0],[0.15,0],[0.22,0.10],[0.33,0.14],[0.45,0.15],[0.45,0.02]].map(q=>[q[0]*dir,q[1]]);s.moveTo(0,-0.02);p.forEach(q=>s.lineTo(q[0],q[1]));s.lineTo(0.45*dir,-0.02);
 const geo=new THREE.ExtrudeGeometry(s,{depth:RL,bevelEnabled:false});const m=new THREE.Mesh(geo,std({color:0xd9d6cf,roughness:0.85}));m.rotation.y=Math.PI/2;m.position.set(-RL/2,0,z);return add(m,true)}
kerb(roadZ0,1);kerb(roadZ1,-1);
flat(RL,ROAD,std({map:asphTex,roughness:0.95}),0,0.005,roadC);
const lineMat=std({color:0xeeeeea,roughness:0.7});
for(let x=-RL/2;x<RL/2;x+=12)flat(3,0.12,lineMat,x,0.012,roadC);
flat(RL,0.1,lineMat,0,0.012,roadZ0+0.9);flat(RL,0.1,lineMat,0,0.012,roadZ1-0.9);
flat(RL,VERGE,vergeMat,0,0.0,roadZ1+0.45+VERGE/2);
{const t=concTex.clone();t.needsUpdate=true;t.repeat.set(RL/3,0.6);flat(RL,FP,std({map:t}),0,0.02,roadZ1+0.45+VERGE-1.1)}

// ---------- lots: our lot and neighbours (mown lawn, paddock grass beyond)
flat(LOT_W,LOT_D,lawnMat,0,0.01,0);
const lotXs=[-3,-2,-1,1,2,3];
lotXs.forEach(i=>{const t=tPad.clone();t.needsUpdate=true;t.repeat.set(LOT_W/14,LOT_D/14);t.offset.set(rnd(),rnd());flat(LOT_W-0.05,LOT_D,std({map:t}),i*LOT_W,0.008,0)});
// lots across the road
const zA=roadZ1+0.45+VERGE+D2;
[-3,-2,-1,0,1,2,3].forEach(i=>{const t=tPad.clone();t.needsUpdate=true;t.repeat.set(LOT_W/14,LOT_D/14);t.offset.set(rnd(),rnd());flat(LOT_W-0.05,LOT_D,std({map:t}),i*LOT_W+12,0.008,zA)});
// mown lawn patches around neighbour houses
function mown(x,z,w,d){const t=tLawn.clone();t.needsUpdate=true;t.repeat.set(w/16,d/16);const m=flat(w,d,std({map:t,transparent:false}),x,0.012,z);return m}

// ---------- fences: timber post and rail, low (1.2 m), weathered grey
const postMat=std({color:0x6e665c,roughness:0.95}),railMat=std({color:0x7a7266,roughness:0.95}),wireMat=new THREE.LineBasicMaterial({color:0x6b665e,transparent:true,opacity:0.6});
function fence(x1,z1,x2,z2,rails){const L=Math.hypot(x2-x1,z2-z1),n=Math.ceil(L/2.7),ang=-Math.atan2(z2-z1,x2-x1);
 const posts=new THREE.InstancedMesh(new THREE.BoxGeometry(0.11,1.25,0.11),postMat,n+1);const d=new THREE.Object3D();
 for(let i=0;i<=n;i++){const t=i/n;d.position.set(x1+(x2-x1)*t,0.62,z1+(z2-z1)*t);d.rotation.set(0,ang,0);d.updateMatrix();posts.setMatrixAt(i,d.matrix)}add(posts,true);
 (rails||[1.1,0.6]).forEach(y=>{const r=new THREE.Mesh(new THREE.BoxGeometry(L,0.08,0.04),railMat);r.position.set((x1+x2)/2,y,(z1+z2)/2);r.rotation.y=ang;add(r,true)})}
// our lot: side and rear
fence(-W2,-D2,W2,-D2);fence(-W2,-D2,-W2,D2);fence(W2,-D2,W2,D2);
[-3,-2,-1,1,2,3].forEach(i=>{if(i!==-1&&i!==1)fence(i*LOT_W-W2,-D2,i*LOT_W+W2,-D2);fence(i*LOT_W+(i<0?-W2:W2),-D2,i*LOT_W+(i<0?-W2:W2),D2)});
// low front fence on neighbours only (ours stays open to the street for the drive)
[-2,-1,1,2].forEach(i=>fence(i*LOT_W-W2+0.5,D2-0.3,i*LOT_W+W2-0.5,D2-0.3,[0.75]));
[-3,-2,-1,0,1,2,3].forEach(i=>{const x=i*LOT_W+12;fence(x-W2,zA+D2,x+W2,zA+D2);fence(x-W2,zA-D2,x-W2,zA+D2)});

// ---------- hip roof builder
function hipGeo(w,d,pitch){// footprint w (x) by d (z) at y=0, centred
 const h=Math.min(w,d)/2*Math.tan(pitch);const pos=[],uv=[];
 const tri=(a,b,c)=>{pos.push(...a,...b,...c);};
 const x=w/2,z=d/2;
 if(w>=d){const r=x-z;const A=[-x,0,z],B=[x,0,z],C=[x,0,-z],D=[-x,0,-z],E=[-r,h,0],F=[r,h,0];
  tri(A,B,F);tri(A,F,E);tri(C,D,E);tri(C,E,F);tri(B,C,F);tri(D,A,E);var caps=[[E,F],[A,E],[D,E],[B,F],[C,F]]}
 else{const r=z-x;const A=[-x,0,z],B=[x,0,z],C=[x,0,-z],D=[-x,0,-z],E=[0,h,r],F=[0,h,-r];
  tri(A,B,E);tri(B,C,F);tri(B,F,E);tri(C,D,F);tri(D,A,E);tri(D,E,F);var caps=[[E,F],[A,E],[B,E],[C,F],[D,F]]}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 // planar uv per face: u along eave, v up slope (for the sheeting texture)
 const p=g.attributes.position;const uvs=[];for(let i=0;i<p.count;i+=3){const a=new THREE.Vector3().fromBufferAttribute(p,i),b=new THREE.Vector3().fromBufferAttribute(p,i+1),c=new THREE.Vector3().fromBufferAttribute(p,i+2);
  const n=new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(c,a)).normalize();const hor=new THREE.Vector3(n.x,0,n.z).normalize();const along=new THREE.Vector3(-hor.z,0,hor.x);
