# =====================================================================
# GLIDE INSIDE SEO REDIRECT BLOCK   (SEO-003)   prepared 15/11/2026
# DROP-IN BLOCK. MERGE into the existing .htaccess on the server. DO NOT replace the server file.
# The live .htaccess (not in this repository) also holds the contact-config.php protection and any
# cPanel/PHP handler lines. Keep those. See "MERGE NOTES" at the bottom before pasting.
# Put this whole block ABOVE any other RewriteRule lines, after "RewriteEngine On".
# The hosting is Apache behind Cloudflare. Every redirect target is the absolute canonical form
# (https://glideinside.com.au/...), so any combination of www, http and index.html is fixed in ONE hop.
# =====================================================================

# ===== BEGIN GI-SEO-REDIRECTS =====
<IfModule mod_rewrite.c>
RewriteEngine On

# --- 0. Work out whether the visitor connection was https (Cloudflare may talk http to the origin) ---
# Cloudflare sends X-Forwarded-Proto and CF-Visitor. %{HTTPS} covers a direct hit on the origin.
# If none of the three says https, the request is treated as http. This cannot loop behind Cloudflare
# "Flexible" SSL because CF-Visitor then still says https for https visitors.
RewriteCond %{HTTP:X-Forwarded-Proto} =https [OR]
RewriteCond %{HTTP:CF-Visitor} https [OR]
RewriteCond %{HTTPS} =on
RewriteRule ^ - [E=GI_HTTPS:1]

# --- 1. Retired /services/*.html pages (never redirect to unrelated pages) ---
# 301 only where a genuinely matching page exists. Everything else is 410 Gone.
RewriteRule ^services/subdivision-feasibility\.html$ https://glideinside.com.au/subdivision/ [R=301,L]
RewriteRule ^services/(drone-photogrammetry|commercial-rural-models|display-home-virtual-tours|residential-fly-throughs)\.html$ - [G,L]

# --- 2. /something/index.html  ->  /something/   (single hop, query string kept automatically) ---
# Skips the app, the portal and any api path, and the ACME challenge folder.
RewriteCond %{THE_REQUEST} \s/+(?:[^\s?]*/)?index\.html[\s?]
RewriteCond %{REQUEST_URI} !^/(plan-studio/app|portal|api|\.well-known)/
RewriteRule ^(.*/)?index\.html$ https://glideinside.com.au/$1 [R=301,L]

# --- 3. www  ->  apex (also forces https in the same hop) ---
RewriteCond %{HTTP_HOST} ^www\.glideinside\.com\.au$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^(.*)$ https://glideinside.com.au/$1 [R=301,L]

# --- 4. http  ->  https on the apex host ---
RewriteCond %{ENV:GI_HTTPS} !=1
RewriteCond %{HTTP_HOST} ^glideinside\.com\.au$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^(.*)$ https://glideinside.com.au/$1 [R=301,L]

# --- 5. Folder without trailing slash  ->  folder with slash, on the canonical host in one hop ---
# Stops Apache's own /pricing -> http://.../pricing/ redirect from creating a second hop.
RewriteCond %{REQUEST_FILENAME} -d
RewriteCond %{REQUEST_URI} !^/(plan-studio/app|portal|api|\.well-known)(/|$)
RewriteRule ^(.+[^/])$ https://glideinside.com.au/$1/ [R=301,L]
</IfModule>
# ===== END GI-SEO-REDIRECTS =====


# ===== BEGIN GI-SEO-CACHE (OPTIONAL) =====
# Long browser cache for fonts only (file names never change). Images and CSS are left alone because
# several are replaced under the same name; use the ?v= query on CSS and JS to bust those.
# Cloudflare can cache /assets/ at the edge from a Cache Rule instead (see perf.md), which is safer.
<IfModule mod_headers.c>
<FilesMatch "\.(woff2)$">
Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
</IfModule>
# ===== END GI-SEO-CACHE =====

