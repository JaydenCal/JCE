<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>
/* website embed: canvas only, dark theme; the page drives layers and views */
html.embed .top,html.embed .dock,html.embed .hud{display:none!important}
html.embed .main{grid-template-columns:1fr!important;grid-template-rows:1fr!important;height:100%;min-height:0}
html.embed .stage{height:100%;min-height:0}
html.embed .app{grid-template-rows:1fr!important}
html.embed body{background:#0b0b0a}
html.embed,html.embed[data-theme="dark"]{--scene-bg:#121210!important;--edge:#000000!important}
html.embed .legend{left:10px;right:auto;top:58px;bottom:auto;font-size:11px}
html.embed .compass{top:10px;left:10px;right:auto;width:40px;height:40px;color:#c7a256}
</style>
<script src="embed.js"></script>
</head><body>
<title>Industrial warehouse development</title>
<style>
/* One-screen 3D review tool: top bar (title, views), canvas, right dock (layers grouped, display modes, picked point, schedule, notes). Dock drops below the canvas on phones. */
:root{
  --bg:#f1f0ec; --panel:#ffffff; --fg:#1e2024; --muted:#676b72; --line:#d8d6cf; --accent:#a8842f;
  --scene-bg:#e3e6e8; --edge:#14161a; --chip:#eceae3;
  --display:"Jost","Century Gothic","Trebuchet MS",sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a1b1d; --panel:#232528; --fg:#e9e7e0; --muted:#9a9da3; --line:#35383d; --accent:#c7a256; --scene-bg:#25282c; --edge:#000000; --chip:#2e3135; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1a1b1d; --panel:#232528; --fg:#e9e7e0; --muted:#9a9da3; --line:#35383d; --accent:#c7a256; --scene-bg:#25282c; --edge:#000000; --chip:#2e3135; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand h1{font-family:var(--display);font-weight:600;font-size:17px;margin:0;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12px;display:block}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
button.view{font:500 12.5px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:5px 9px;cursor:pointer}
button.view:hover{border-color:var(--accent)}
button.view:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:1fr 350px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;background:var(--scene-bg)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.hud .tag{font:500 12px var(--mono);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:min(70vw,520px)}
.hud .tag b{color:var(--accent)}
.compass{position:absolute;right:12px;top:12px;width:54px;height:54px;pointer-events:none}
.legend{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11.5px;display:none;gap:4px;flex-direction:column}
.legend .bar{height:10px;width:160px;border-radius:3px;background:linear-gradient(90deg,#ff5940,#ffffff 50%,#4073ff)}
.legend .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px}
.dock{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dock h2{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.layers label,.opts label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.layers label.wide{grid-column:1/-1}
.layers input,.opts input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px}
table{border-collapse:collapse;width:100%;font-size:12.3px}
td,th{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
td.v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;max-width:190px}
.note{font-size:12.5px;color:var(--muted)}
.readout{font-family:var(--mono);font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-variant-numeric:tabular-nums}
.readout span:nth-child(odd){color:var(--muted)}
@media (max-width:900px){ .main{grid-template-columns:1fr;grid-template-rows:58vh auto} .dock{border-left:0;border-top:1px solid var(--line)} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app">
  <div class="top">
    <div class="brand"><h1 id="title"></h1><span id="subtitle"></span></div>
    <div class="group" id="views"><span class="lab">View</span></div>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="c"></canvas>
      <svg class="compass" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="25" fill="none" stroke="currentColor" stroke-opacity=".35"/><g id="needle"><polygon points="27,5 32,27 27,23 22,27" fill="currentColor"/><text x="27" y="42" text-anchor="middle" font-size="9" font-family="IBM Plex Mono, monospace" fill="currentColor">N</text></g></svg>
      <div class="hud"><div class="tag" id="hover">Hover for part name · click for E, N, RL and depth to existing ground</div><div class="tag" id="pick" hidden></div></div>
      <div class="legend" id="legend"><div>Cut / fill vs existing</div><div class="bar"></div><div class="lbl"><span>cut 0.6</span><span>0</span><span>fill 0.6 m</span></div></div>
    </div>
    <aside class="dock">
      <section><h2>Layers</h2><div class="layers" id="layers"></div></section>
      <section>
        <h2>Display</h2>
        <div class="opts">
          <label id="cfwrap"><input type="checkbox" id="O-cutfill">Colour surface by cut / fill</label>
          <label><input type="checkbox" id="O-xray">Buildings see-through</label>
          <label><input type="checkbox" id="O-sxray">Ground see-through (pits and pipes)</label>
          <label><input type="checkbox" id="O-edges" checked>Edge lines</label>
          <label><input type="checkbox" id="O-shadow" checked>Shadows</label>
          <label><input type="checkbox" id="O-exag">Exaggerate levels ×3</label>
        </div>
      </section>
      <section><h2>Picked point</h2><div class="readout" id="readout"><span>Easting</span><span>-</span><span>Northing</span><span>-</span><span>RL (AHD)</span><span>-</span><span>Part</span><span>-</span></div></section>
      <section><h2>Design summary</h2><table id="summary"></table></section>
      <section class="note"><h2>Review notes</h2><ul id="notes" style="margin:0;padding-left:18px"></ul></section>
    </aside>
  </div>
</div>

<script src="../vendor/three.min.js"></script>
<script src="../vendor/OrbitControls.js"></script>
<script src="warehouse.js"></script>

<script src="embed-bridge.js"></script>
</body></html>
