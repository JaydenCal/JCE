/* Plan Studio. Drafting-table tool. All colours are --ps-* tokens (docs/SCOPE.md 10.4). */

:root {

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ps-bg);
  color: var(--ps-text);
  font-family: var(--ps-font-ui);
  font-size: 14px;
  line-height: 1.35;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

#app {
  height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}

:focus-visible { outline: 2px solid var(--ps-focus); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
svg { display: block; }

.ps-mono { font-family: var(--ps-font-mono); font-variant-numeric: tabular-nums; }
.ps-label {
  font-family: var(--ps-font-label);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ps-muted);
}
.ps-boot { margin: 24px 0; color: var(--ps-muted); font-family: var(--ps-font-label); letter-spacing: 0.08em; text-transform: uppercase; }
.ps-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell layout ------------------------------------------------------------ */
.ps-shell {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--ps-panel);
  border: 1px solid var(--ps-border-strong);
  border-radius: var(--ps-radius-lg);
  overflow: hidden;
  position: relative;
}
.ps-main {
  min-height: 0;
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr) 328px;
  border-top: 1px solid var(--ps-border);
}
.ps-stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--ps-canvas);
  overflow: hidden;
}
.ps-plan-host, .ps-3d-host { position: absolute; inset: 0; }
/* Split view: plan left, live 3D right (stacked on narrow screens), a draggable divider between (src/ui/views.js sets --ps-split). */
.ps-shell { --ps-split: 50%; }
.ps-shell[data-view="split"] .ps-plan-host { right: auto; width: var(--ps-split); }
.ps-shell[data-view="split"] .ps-3d-host { left: var(--ps-split); }
.ps-split-bar {
  position: absolute; top: 0; bottom: 0; left: var(--ps-split); width: 12px; margin-left: -6px; z-index: 30;
  cursor: col-resize; touch-action: none; display: flex; align-items: center; justify-content: center; outline: none;
}
.ps-split-bar::before { content: ''; position: absolute; top: 0; bottom: 0; left: 5px; width: 2px; background: var(--ps-border-strong); }
.ps-split-bar:hover::before, .ps-split-bar:focus-visible::before, .ps-split-bar.is-dragging::before { background: var(--ps-accent); }
.ps-split-grip { position: relative; width: 6px; height: 40px; border-radius: 3px; background: var(--ps-panel); border: 1px solid var(--ps-border-strong); }
.ps-split-bar.is-dragging .ps-split-grip, .ps-split-bar:focus-visible .ps-split-grip { border-color: var(--ps-accent); }
.ps-shell.is-splitting .ps-plan-host, .ps-shell.is-splitting .ps-3d-host { pointer-events: none; }
.ps-shell.is-splitting { cursor: col-resize; user-select: none; }
.ps-backplan { position: absolute; top: 12px; left: 12px; z-index: 31; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
.ps-shell[data-view="split"] .ps-backplan { left: calc(var(--ps-split) + 12px); }
.ps-back .ps-btn-text { font-weight: 600; }
/* In the split view the frontage prompt belongs to the plan pane. */
.ps-shell[data-view="split"] .ps-frontage { left: calc(var(--ps-split) / 2); width: min(520px, calc(var(--ps-split) - 24px)); }
.ps-topbar > .ps-back { margin-right: 2px; }
@media (max-width: 899.98px) {
  .ps-shell[data-view="split"] .ps-plan-host { right: 0; bottom: auto; width: auto; height: var(--ps-split); }
  .ps-shell[data-view="split"] .ps-3d-host { left: 0; top: var(--ps-split); }
  .ps-split-bar { top: var(--ps-split); bottom: auto; left: 0; right: 0; width: auto; height: 14px; margin: -7px 0 0; cursor: row-resize; }
  .ps-split-bar::before { top: 6px; bottom: auto; left: 0; right: 0; width: auto; height: 2px; }
  .ps-split-grip { width: 40px; height: 6px; }
  .ps-shell[data-view="split"] .ps-backplan { left: 12px; top: calc(var(--ps-split) + 12px); }
  .ps-shell.is-splitting { cursor: row-resize; }
  .ps-back .ps-btn-text { display: none; }
  .ps-back:has(.ps-btn-text) { width: 32px; padding: 0; }
}
.ps-plan-host { overflow: hidden; touch-action: none; }
.ps-3d-host { background: var(--ps-canvas); }
.ps-plan-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.ps-plan-overlay { position: absolute; inset: 0; pointer-events: none; }
.ps-plan-overlay > * { pointer-events: auto; }

/* Top bar ------------------------------------------------------------------ */
.ps-topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 8px 12px;
  background: var(--ps-panel);
  min-width: 0;
}
.ps-brand { display: flex; align-items: center; gap: 8px; }
.ps-logo {
  width: 22px; height: 22px; flex: none;
  border: 2px solid var(--ps-accent);
  border-radius: 3px;
  position: relative;
}
.ps-logo::before, .ps-logo::after { content: ''; position: absolute; background: var(--ps-accent); }
.ps-logo::before { left: 5px; top: -2px; bottom: 7px; width: 2px; }
.ps-logo::after { left: -2px; right: 5px; top: 7px; height: 2px; }
.ps-product {
  font-family: var(--ps-font-label);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.ps-name {
  width: 176px;
  max-width: 100%;
  height: 32px;
  padding: 0 9px;
  background: var(--ps-field);
  border: 1px solid transparent;
  border-radius: var(--ps-radius-sm);
  font-weight: 500;
  font-size: 15px;
  text-overflow: ellipsis;
}
.ps-name:hover { border-color: var(--ps-border); }
.ps-name:focus { border-color: var(--ps-accent); }
.ps-group { display: flex; align-items: center; gap: 4px; }
.ps-topbar-spacer { flex: 1 1 0; min-width: 0; }
.ps-premium-slot { display: flex; align-items: center; gap: 8px; min-height: 32px; margin-left: auto; flex: 0 0 auto; white-space: nowrap; }
@media (max-width: 1699.98px) { .ps-product { font-size: 14px; letter-spacing: 0.03em; } .ps-name { width: 110px; } .ps-topbar { gap: 8px; } .ps-shell .ps-topbar .ps-back .ps-btn-text { display: none !important; } .ps-shell .ps-topbar .ps-back.ps-btn--wide:has(.ps-btn-text) { width: 32px !important; padding: 0 !important; } }
/* Below 1560px the topbar must stay on one row in 3D (the Roof chip adds a control): the logo mark stands in for the product name and the gaps tighten. */
@media (max-width: 1559.98px) { .ps-product { display: none; } .ps-name { width: 100px; } .ps-topbar { gap: 6px; } }
/* Two level designs add Ground / First / All and the Roof chip: from 1440 down, Find my block shows its icon only, the level tabs and chips are compact and the gaps tighten so the bar stays on one row. */
@media (min-width: 901px) and (max-width: 1559.98px) {
  .ps-topbar { gap: 4px 6px; padding: 8px 10px; }
  .ps-shell .ps-topbar [data-action="find-block"] .ps-btn-text { display: none !important; }
  .ps-shell .ps-topbar [data-action="find-block"].ps-btn--wide:has(.ps-btn-text) { width: 32px !important; padding: 0 !important; }
  .ps-topbar .ps-levels { gap: 3px; flex-wrap: nowrap; }
  .ps-topbar .ps-level-tab { height: 28px; padding: 0 8px; max-width: 112px; } /* wide enough for Mezzanine */
  .ps-topbar .ps-level-tab:not(.ps-level-add) { min-width: 0; }
  .ps-topbar .ps-seg-btn { padding: 0 9px; }
  .ps-premium-slot { gap: 6px; }
  .ps-premium-slot .ps-btn { padding: 0 9px; }
}

/* Buttons and segmented controls ------------------------------------------ */
.ps-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 11px;
  background: var(--ps-field);
  color: var(--ps-text);
  border: 1px solid var(--ps-border-strong);
  border-radius: var(--ps-radius);
  font-weight: 500;
  white-space: nowrap;
}
.ps-btn:hover:not(:disabled) { background: var(--ps-hover); }
.ps-btn:disabled { opacity: 0.45; }
.ps-btn svg { width: 18px; height: 18px; flex: none; }
.ps-btn[aria-pressed="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }
.ps-btn--primary { background: var(--ps-accent); border-color: var(--ps-accent); color: var(--ps-accent-ink); }
.ps-btn--primary:hover:not(:disabled) { background: var(--ps-accent); filter: brightness(1.08); }
.ps-btn--ghost { background: transparent; border-color: transparent; }
.ps-btn--icon { width: 32px; padding: 0; }
.ps-btn--danger { color: var(--ps-danger); border-color: var(--ps-danger); }
.ps-btn--sm { height: 26px; padding: 0 8px; font-size: 13px; }

.ps-seg {
  display: inline-flex;
  border: 1px solid var(--ps-border-strong);
  border-radius: var(--ps-radius);
  overflow: hidden;
  background: var(--ps-field);
  flex: none;
}
.ps-seg-btn {
  height: 30px; padding: 0 12px;
  background: transparent; border: 0; border-right: 1px solid var(--ps-border);
  font-weight: 500; color: var(--ps-muted); white-space: nowrap;
}
.ps-seg-btn:last-child { border-right: 0; }
.ps-seg-btn:hover { background: var(--ps-hover); color: var(--ps-text); }
.ps-seg-btn[aria-selected="true"], .ps-seg-btn[aria-pressed="true"] { background: var(--ps-accent); color: var(--ps-accent-ink); }
.ps-seg-btn:disabled { opacity: 0.4; }
.ps-seg--sm .ps-seg-btn { height: 26px; padding: 0 9px; font-size: 13px; }

.ps-levels { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ps-level-tab {
  height: 30px; padding: 0 11px;
  background: transparent;
  border: 1px solid var(--ps-border);
  border-radius: var(--ps-radius);
  font-weight: 500; color: var(--ps-muted);
}
.ps-level-tab:hover { background: var(--ps-hover); color: var(--ps-text); }
.ps-level-tab[aria-selected="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }
.ps-level-add { border-style: dashed; }
.ps-level-tab { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-level-tab:not(.ps-level-add) { min-width: 44px; }

/* The toolbox only belongs to the plan view. Explicit columns keep the stage in place without it. */
.ps-toolbox { grid-column: 1; }
.ps-stage { grid-column: 2; }
.ps-panel { grid-column: 3; }
.ps-shell:is([data-view="3d"], [data-view="walk"]) .ps-main { grid-template-columns: 0 minmax(0, 1fr) 328px; }
.ps-shell:is([data-view="3d"], [data-view="walk"]) .ps-toolbox { display: none; }
.ps-shell[data-mode="demo"] .ps-tab[data-tab="ai"] { display: none; }
.ps-panel .ps-seg { display: flex; width: 100%; }
.ps-panel .ps-seg .ps-seg-btn { flex: 1 1 auto; min-width: 0; padding: 0 6px; }

/* Toolbox ------------------------------------------------------------------ */
.ps-toolbox {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 8px 0;
  background: var(--ps-panel);
  border-right: 1px solid var(--ps-border);
  overflow-y: auto;
  min-height: 0;
}
.ps-tool[hidden], .ps-tool-sep[hidden] { display: none; }
.ps-tool-sep { width: 28px; height: 1px; background: var(--ps-border); margin: 4px 0; flex: none; }
.ps-tool {
  position: relative;
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  background: transparent; border: 1px solid transparent; border-radius: var(--ps-radius);
  color: var(--ps-text);
}
.ps-tool svg { width: 22px; height: 22px; }
.ps-tool:hover { background: var(--ps-hover); }
.ps-tool[aria-pressed="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }
.ps-tool-key {
  position: absolute; right: 3px; bottom: 1px;
  font-family: var(--ps-font-mono); font-size: 9px; line-height: 1;
  color: var(--ps-faint);
}
.ps-tool[aria-pressed="true"] .ps-tool-key { color: var(--ps-accent); }

/* Stage overlays ------------------------------------------------------------ */
.ps-stage-note {
  position: absolute; inset: 0; z-index: 3;
  display: grid; place-items: center; text-align: center;
  background: var(--ps-canvas); padding: 24px;
}
.ps-stage-note > div { max-width: 360px; }
.ps-spinner {
  width: 22px; height: 22px; margin: 0 auto 10px;
  border: 2px solid var(--ps-border-strong); border-top-color: var(--ps-accent);
  border-radius: 50%;
  animation: ps-spin 0.9s linear infinite;
}
@keyframes ps-spin { to { transform: rotate(360deg); } }

.ps-hintbar {
  position: absolute; left: 12px; top: 10px; z-index: 2;
  max-width: calc(100% - 24px);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  pointer-events: none;
}
.ps-hintbar > * { pointer-events: auto; }
.ps-chip-note {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: 999px;
  font-size: 13px; color: var(--ps-text);
}
.ps-chip-note .ps-mono { font-size: 12px; }

.ps-welcome {
  position: absolute; left: 50%; top: 50%; z-index: 40;
  transform: translate(-50%, -50%);
  width: min(460px, calc(100% - 24px));
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px;
  background: var(--ps-panel);
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
  box-shadow: var(--ps-shadow);
}
.ps-welcome h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.ps-welcome p { margin: 0 0 8px; color: var(--ps-muted); }
.ps-welcome-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ps-welcome-find { height: 48px; padding: 0 22px; font-size: 16px; font-weight: 600; flex: 1 1 100%; justify-content: center; gap: 10px; }

/* Furniture drawer ----------------------------------------------------------- */
.ps-drawer {
  position: absolute; left: 0; top: 0; bottom: 0; z-index: 5;
  width: min(316px, 100%);
  display: flex; flex-direction: column;
  background: var(--ps-panel);
  border-right: 1px solid var(--ps-border-strong);
  box-shadow: var(--ps-shadow);
}
.ps-drawer-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px; }
.ps-drawer-head h3 { margin: 0; flex: 1; font-size: 15px; font-weight: 600; }
.ps-drawer-search { padding: 0 10px 8px; }
.ps-cats { display: flex; gap: 4px; padding: 0 10px 8px; overflow-x: auto; flex: none; scrollbar-width: thin; }
.ps-cat {
  flex: none; height: 26px; padding: 0 10px;
  background: transparent; border: 1px solid var(--ps-border); border-radius: 999px;
  color: var(--ps-muted); font-size: 13px; font-weight: 500;
}
.ps-cat:hover { background: var(--ps-hover); }
.ps-cat[aria-pressed="true"] { background: var(--ps-accent); border-color: var(--ps-accent); color: var(--ps-accent-ink); }
.ps-tiles {
  flex: 1; min-height: 0; overflow-y: auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px;
  padding: 4px 10px 12px; align-content: start;
}
.ps-tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 4px 6px;
  background: var(--ps-field); border: 1px solid var(--ps-border); border-radius: var(--ps-radius);
  font-size: 12px; line-height: 1.15; text-align: center; color: var(--ps-text);
}
.ps-tile:hover { border-color: var(--ps-accent); }
.ps-tile[aria-pressed="true"] { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
.ps-tile canvas { width: 64px; height: 64px; }
.ps-empty { padding: 18px 12px; color: var(--ps-muted); text-align: center; }

/* Popovers (in page, never alert/confirm/prompt) ----------------------------- */
.ps-popover {
  position: absolute; z-index: 6;
  width: 272px; max-width: calc(100% - 16px);
  padding: 12px;
  background: var(--ps-panel);
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
  box-shadow: var(--ps-shadow);
}
.ps-popover h4 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.ps-popover .ps-field { margin-bottom: 8px; }
.ps-popover-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.ps-hatch-note { margin: 0 0 8px; font-size: 13px; color: var(--ps-muted); }

/* Right panel ----------------------------------------------------------------- */
.ps-panel {
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background: var(--ps-panel);
  border-left: 1px solid var(--ps-border);
}
.ps-panel-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--ps-border); }
.ps-tabs { display: flex; gap: 2px; flex: 1; }
.ps-tab {
  height: 30px; padding: 0 8px; white-space: nowrap;
  background: transparent; border: 0; border-bottom: 2px solid transparent;
  font-family: var(--ps-font-label); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ps-muted);
}
.ps-tab:hover { color: var(--ps-text); }
.ps-tab[aria-selected="true"] { color: var(--ps-accent); border-bottom-color: var(--ps-accent); }
.ps-sheet-toggle { display: none; }
.ps-panel-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px; }
.ps-panel-body > section { min-width: 0; }

.ps-sec { margin: 0 0 16px; }
.ps-sec > h3, .ps-sec-title {
  margin: 0 0 8px;
  font-family: var(--ps-font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ps-muted);
  display: flex; align-items: center; gap: 8px;
}
.ps-sec > h3::after { content: ''; flex: 1; height: 1px; background: var(--ps-border); }
.ps-sel-title { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; }
.ps-sel-title strong { font-size: 16px; font-weight: 600; }
.ps-sel-title span { color: var(--ps-muted); font-size: 13px; }

.ps-field { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; margin-bottom: 7px; }
.ps-field > label, .ps-field > .ps-field-label {
  font-family: var(--ps-font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--ps-muted); line-height: 1.15;
}
.ps-field--stack { grid-template-columns: minmax(0, 1fr); gap: 4px; }
.ps-input, .ps-select, .ps-textarea {
  width: 100%; height: 30px; padding: 0 8px;
  background: var(--ps-field); color: var(--ps-text);
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-sm);
  min-width: 0;
}
.ps-input:hover:not(:disabled), .ps-select:hover:not(:disabled) { border-color: var(--ps-faint); }
.ps-input:disabled, .ps-select:disabled { opacity: 0.55; }
.ps-input:focus, .ps-select:focus { border-color: var(--ps-accent); outline-offset: 0; }
.ps-input[type="number"], .ps-input.ps-num { font-family: var(--ps-font-mono); font-variant-numeric: tabular-nums; }
.ps-input-wrap { position: relative; }
.ps-input-wrap .ps-input { padding-right: 34px; }
.ps-unit { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--ps-font-mono); font-size: 11px; color: var(--ps-faint); pointer-events: none; }
.ps-check { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; min-height: 26px; }
.ps-check input { width: 16px; height: 16px; accent-color: var(--ps-accent); margin: 0; }
.ps-range { width: 100%; accent-color: var(--ps-accent); }
.ps-readout { font-family: var(--ps-font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.ps-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ps-row > .ps-btn { flex: 1 1 auto; }
.ps-hint { margin: 0 0 10px; color: var(--ps-muted); font-size: 13px; }
.ps-note-box { padding: 8px 10px; border: 1px solid var(--ps-border); border-radius: var(--ps-radius); background: var(--ps-panel-2); color: var(--ps-muted); font-size: 13px; margin-bottom: 10px; }

.ps-radio-row { display: grid; gap: 6px; margin-bottom: 10px; }
.ps-radio {
  display: flex; align-items: center; gap: 8px; padding: 6px 9px;
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius); background: var(--ps-field);
  text-align: left; width: 100%;
}
.ps-radio[aria-pressed="true"] { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
.ps-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--ps-border-strong); flex: none; }
.ps-swatch--new { background: var(--ps-ink); }
.ps-swatch--existing { background: var(--ps-wall-existing); }
.ps-swatch--demolish { background: transparent; border: 1px dashed var(--ps-wall-demolish); }

/* Summary tables ---------------------------------------------------------------- */
.ps-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ps-table th {
  text-align: left; padding: 3px 4px;
  font-family: var(--ps-font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ps-muted);
  border-bottom: 1px solid var(--ps-border-strong);
}
.ps-table td { padding: 4px; border-bottom: 1px solid var(--ps-border); vertical-align: top; }
.ps-table .num { text-align: right; font-family: var(--ps-font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ps-table tr.total td { font-weight: 600; border-top: 1px solid var(--ps-border-strong); }
.ps-table tr.clickable { cursor: pointer; }
.ps-table tr.clickable:hover td { background: var(--ps-hover); }
.ps-level-block { margin-bottom: 12px; }
.ps-level-block h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }

.ps-warns { display: grid; gap: 6px; }
.ps-warn {
  display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left;
  padding: 6px 8px; background: var(--ps-warning-soft); color: var(--ps-text);
  border: 1px solid var(--ps-warning); border-radius: var(--ps-radius); font-size: 13px;
}
.ps-warn svg { width: 16px; height: 16px; flex: none; color: var(--ps-warning); margin-top: 1px; }
.ps-ok-note { display: flex; gap: 8px; align-items: center; color: var(--ps-ok); font-size: 13px; }
.ps-ok-note svg { width: 16px; height: 16px; }

.ps-ai-mount { min-height: 80px; }
.ps-ai-fallback { padding: 14px; border: 1px dashed var(--ps-border-strong); border-radius: var(--ps-radius-lg); color: var(--ps-muted); }

/* Status bar ----------------------------------------------------------------------- */
.ps-statusbar {
  display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap;
  padding: 5px 12px;
  background: var(--ps-panel-2); border-top: 1px solid var(--ps-border);
  font-size: 12.5px; color: var(--ps-muted); min-height: 32px;
}
.ps-statusbar .ps-mono { color: var(--ps-text); font-size: 12px; }
.ps-status-cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ps-status-hint { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ps-text); }
.ps-autosave[data-state="dirty"] { color: var(--ps-warning); }
.ps-autosave[data-state="error"] { color: var(--ps-danger); font-weight: 600; }
.ps-autosave[data-state="saved"] { color: var(--ps-ok); }
.ps-status-btn {
  height: 22px; padding: 0 8px; background: transparent; color: var(--ps-text);
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-sm); font-size: 12px; font-weight: 500;
}
.ps-status-btn:hover { background: var(--ps-hover); }
.ps-status-btn[aria-pressed="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }

/* Modal and toasts ------------------------------------------------------------------ */
.ps-modal-root { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.ps-modal-root > * { pointer-events: auto; }
.ps-scrim {
  position: absolute; inset: 0; background: var(--ps-scrim);
  display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px;
}
.ps-modal {
  width: min(760px, 100%); max-height: min(640px, 100%);
  display: flex; flex-direction: column;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
  box-shadow: var(--ps-shadow);
}
.ps-modal--sm { width: min(420px, 100%); }
.ps-modal-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.ps-modal-head h2 { margin: 0; flex: 1; font-size: 18px; font-weight: 600; }
.ps-modal-body { padding: 0 16px 16px; overflow-y: auto; min-height: 0; }
.ps-modal-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--ps-border); }
.ps-confirm {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between;
  margin-bottom: 12px; padding: 10px 12px;
  background: var(--ps-warning-soft); border: 1px solid var(--ps-warning); border-radius: var(--ps-radius);
}
.ps-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.ps-card {
  display: flex; flex-direction: column; gap: 4px; text-align: left;
  padding: 12px; min-height: 112px;
  background: var(--ps-field); border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
}
.ps-card:hover { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
.ps-card strong { font-size: 15px; font-weight: 600; }
.ps-card p { margin: 0; color: var(--ps-muted); font-size: 13px; flex: 1; }
.ps-card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.ps-tag {
  padding: 1px 7px; border: 1px solid var(--ps-border-strong); border-radius: 999px;
  font-family: var(--ps-font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ps-muted);
}
.ps-toasts {
  position: absolute; left: 50%; bottom: 44px; z-index: 60; transform: translateX(-50%);
  display: grid; gap: 6px; justify-items: center; width: min(520px, calc(100% - 24px)); pointer-events: none;
}
.ps-toast {
  pointer-events: auto; max-width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--ps-text); color: var(--ps-panel);
  border-radius: var(--ps-radius); box-shadow: var(--ps-shadow);
  animation: ps-toast-in 0.18s ease-out;
}
.ps-toast[data-kind="error"] { background: var(--ps-danger); color: var(--ps-on-status); }
.ps-toast[data-kind="warn"] { background: var(--ps-warning); color: var(--ps-on-status); }
.ps-toast[data-kind="ok"] { background: var(--ps-ok); color: var(--ps-on-status); }
.ps-toast button { background: transparent; border: 0; color: inherit; text-decoration: underline; padding: 0; }
@keyframes ps-toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Responsive ----------------------------------------------------------------------------- */
@media (max-width: 1399.98px) {
  .ps-btn .ps-btn-text { display: none; }
  .ps-btn:has(.ps-btn-text) { width: 32px; padding: 0; }
  .ps-btn--wide .ps-btn-text { display: inline; }
  .ps-btn--wide:has(.ps-btn-text) { width: auto; padding: 0 11px; }
  .ps-name { width: 150px; }
}
/* The 3D views add level tabs and a Roof toggle, so the file buttons go icon-only a little sooner there. */
@media (min-width: 1400px) and (max-width: 1599.98px) {
  .ps-shell .ps-btn .ps-btn-text { display: none; }
  .ps-shell .ps-btn:has(.ps-btn-text) { width: 32px; padding: 0; }
  .ps-shell .ps-btn--wide .ps-btn-text { display: inline; }
  .ps-shell .ps-btn--wide:has(.ps-btn-text) { width: auto; padding: 0 11px; }
}
@media (max-width: 899.98px) {
  #app { padding-block: 8px; }
  .ps-main { display: flex; flex-direction: column; position: relative; }
  .ps-stage { flex: 1 1 auto; order: 1; }
  .ps-toolbox {
    order: 2; flex: none; flex-direction: row; justify-content: flex-start;
    padding: 4px 6px; border-right: 0; border-top: 1px solid var(--ps-border);
    overflow-x: auto; overflow-y: hidden;
  }
  .ps-tool-sep { width: 1px; height: 28px; margin: 0 4px; }
  .ps-panel { order: 3; flex: none; border-left: 0; border-top: 1px solid var(--ps-border-strong); max-height: 52%; }
  .ps-sheet-toggle { display: inline-flex; }
  .ps-panel[data-open="false"] .ps-panel-body { display: none; }
  .ps-panel-head { padding: 4px 8px; }
  .ps-topbar { gap: 6px 8px; padding: 6px 8px; }
  .ps-product { display: none; }
  .ps-name { width: 130px; flex: 1 1 110px; }
  .ps-topbar-spacer { display: none; }
  .ps-field { grid-template-columns: 84px minmax(0, 1fr); }
  .ps-drawer { width: 100%; }
  .ps-statusbar { gap: 4px 12px; padding: 4px 8px; }
  .ps-status-hint { flex-basis: 100%; order: 9; }
  .ps-toasts { bottom: 90px; }
}
@media (max-width: 520px) {
  .ps-cell-cursor, .ps-autosave:not([data-state="error"]) { display: none; }
  .ps-level-tab, .ps-seg-btn { padding: 0 8px; }
  .ps-view-switch .ps-seg-btn { padding: 0 9px; }
}
@media (max-width: 599.98px) {
  .ps-view-switch .ps-seg-btn[data-view="split"] { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

/* Level chip menu ------------------------------------------------------------ */
.ps-chip-wrap { position: relative; display: inline-flex; }
.ps-chip-notes { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.ps-chip-btn { cursor: pointer; font: inherit; }
.ps-chip-btn:hover { background: var(--ps-hover); }
.ps-chip-btn[aria-expanded="true"] { border-color: var(--ps-accent); }
.ps-chip-btn svg { width: 12px; height: 12px; color: var(--ps-muted); }
.ps-level-menu {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 7;
  min-width: 200px; max-width: 280px; padding: 4px;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
  box-shadow: var(--ps-shadow);
}
.ps-menu-item {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px;
  background: transparent; border: 0; border-radius: var(--ps-radius-sm); text-align: left; color: var(--ps-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ps-menu-item:hover { background: var(--ps-hover); }
.ps-menu-item[aria-checked="true"] { color: var(--ps-accent); font-weight: 600; }
.ps-menu-tick { width: 14px; height: 14px; flex: none; display: inline-grid; place-items: center; }
.ps-menu-tick svg { width: 14px; height: 14px; }
.ps-menu-sep { height: 1px; margin: 4px 2px; background: var(--ps-border); }
.ps-menu-title { padding: 4px 6px 6px; font-family: var(--ps-font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ps-muted); }
.ps-level-menu .ps-input { margin: 0 0 6px; }
.ps-menu-actions { display: flex; justify-content: flex-end; gap: 6px; padding: 0 2px 2px; }

/* Presets, badges and small additions ----------------------------------------- */
.ps-field--chips { align-items: start; }
.ps-field--chips > .ps-field-label { padding-top: 4px; }
.ps-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.ps-chip {
  height: 24px; padding: 0 7px; background: var(--ps-field); color: var(--ps-text);
  border: 1px solid var(--ps-border-strong); border-radius: 999px;
  font-family: var(--ps-font-mono); font-size: 11.5px;
}
.ps-chip:hover { background: var(--ps-hover); }
.ps-chip[aria-pressed="true"] { background: var(--ps-accent); border-color: var(--ps-accent); color: var(--ps-accent-ink); }
.ps-badge {
  padding: 1px 6px; border-radius: 999px; background: var(--ps-accent-soft); color: var(--ps-accent);
  font-family: var(--ps-font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
}
.ps-btn--block { width: 100%; }
.ps-tool--wheel { margin-top: auto; }

/* Inventory wheel ------------------------------------------------------------- */
.ps-wheel-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20, 22, 26, 0.10); touch-action: none; }
.ps-wheel { position: absolute; pointer-events: none; }
.ps-wheel-svg { position: absolute; inset: 0; overflow: visible; filter: drop-shadow(0 6px 16px rgba(20, 22, 26, 0.22)); }
.ps-wheel-seg { fill: var(--ps-panel); stroke: var(--ps-border-strong); stroke-width: 1; transition: fill 0.08s; }
.ps-wheel-seg.is-active { fill: var(--ps-hover); }
.ps-wheel-seg.is-hover { fill: var(--ps-accent-soft); stroke: var(--ps-accent); stroke-width: 1.5; }
.ps-wheel-seg--slot { fill: var(--ps-panel-2); }

.cm-fz-total { font-weight: 600; border-top: 1px solid var(--ps-border-strong, #c9ccd2); }

.cm-fz-units th, .cm-fz-units td { text-align: right; padding: 2px 3px; border-bottom: 1px solid var(--ps-border, #e1e3e7); }
.cm-fz-units th:first-child, .cm-fz-units td:first-child { text-align: left; }
.cm-checks { border-top: 1px solid var(--ps-border, #e1e3e7); margin-top: 6px; padding-top: 8px; display: grid; gap: 6px; }
.cm-check { margin: 0; padding: 6px 8px; border-radius: 8px; background: var(--ps-panel-2); font-size: 12.5px; }
.cm-check.cm-warn { background: rgba(147,88,0,.13); border-left: 3px solid var(--ps-warning, #935800); }
.cm-check.cm-info { border-left: 3px solid #c7a256; }
.cm-strip { position: absolute; left: 342px; bottom: 14px; z-index: 6; display: flex; gap: 0; background: var(--ps-panel); border: 1px solid var(--ps-border-strong, #c9ccd2); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.16); overflow: hidden; max-width: calc(100% - 356px); }
.cm-cell { padding: 8px 14px; display: grid; gap: 1px; border-right: 1px solid var(--ps-border, #e1e3e7); min-width: 84px; align-content: start; }
.cm-cell:last-child { border-right: 0; }
.cm-cell b { font-size: 17px; color: var(--ps-text); white-space: nowrap; }
.cm-cell i { font-style: normal; font-size: 11px; color: var(--ps-muted); max-width: 150px; overflow-wrap: anywhere; }
/* 3D and walk: the dock steps aside so the model is clear, and the strip moves to the top between the view buttons. */
.ps-shell:is([data-view="3d"],[data-view="walk"]) .cm-dock { display: none; }
.ps-shell:is([data-view="3d"],[data-view="walk"]) .cm-strip { top: 12px; bottom: auto; left: 176px; max-width: calc(100% - 370px); overflow-x: auto; }
/* The "Map data" chip sits above the strip, not on it. */
.ps-shell .ps-stage[data-commercial="1"] .ps-credit { bottom: 112px; }
.ps-shell:is([data-view="3d"],[data-view="walk"]) .ps-stage[data-commercial="1"] .ps-credit { bottom: 50px; }
.cm-short { display: none; }
.cm-sheet-toggle { display: inline-block; margin-left: auto; min-width: 30px; border: 1px solid var(--ps-border-strong, #c9ccd2); background: var(--ps-panel-2); color: inherit; border-radius: 8px; padding: 3px 12px; font: inherit; font-weight: 600; cursor: pointer; }
/* Close, collapse and reopen (any width). The title is the drag handle on wide screens. */
.cm-close { border: 1px solid var(--ps-border-strong, #c9ccd2); background: var(--ps-panel-2); color: inherit; border-radius: 8px; padding: 1px 9px; font: inherit; font-size: 16px; line-height: 1.2; cursor: pointer; }
.cm-close:hover, .cm-sheet-toggle:hover { background: var(--ps-border, #e3e5e9); }
.cm-link { border: 0; background: none; color: var(--ps-accent, #a3532d); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
.cm-reopen { position: absolute; left: 12px; top: 12px; z-index: 6; border: 1px solid var(--ps-border-strong, #c9ccd2); background: var(--ps-panel); color: var(--ps-text); border-radius: 18px; padding: 7px 14px; font: 600 13px var(--ps-font-ui, system-ui, sans-serif); box-shadow: 0 4px 16px rgba(0,0,0,.16); cursor: pointer; }
.cm-reopen[hidden], .ps-shell:is([data-view="3d"],[data-view="walk"]) .cm-reopen { display: none; }
.cm-title { cursor: grab; }
.cm-dock[data-sheet="closed"] { overflow: hidden; max-height: none; padding-bottom: 8px; }
.cm-dock[data-sheet="closed"] > :not(.cm-head) { display: none; }
.cm-dock[data-sheet="closed"] .cm-head { margin-bottom: 0; }
.cm-dock[data-sheet="closed"] .cm-head > :not(.cm-title) { display: none; }
/* Phone width: the dock is a bottom sheet that collapses to its title bar, and the strip runs along the top of the plan, so neither covers the other or the Demo tips chip. */
@media (max-width: 899.98px) {
  .cm-dock { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 58%; border-radius: 14px 14px 0 0; border-bottom: 0; padding-bottom: 14px; box-shadow: 0 -6px 24px rgba(0,0,0,.18); }
  .cm-dock::before { content: ''; display: block; width: 36px; height: 4px; border-radius: 4px; background: var(--ps-border-strong, #c9ccd2); margin: 0 auto 8px; }
  .cm-sheet-toggle { display: inline-block; }
  .cm-full { display: none; }
  .cm-short { display: inline; }
  .cm-dock[data-sheet="closed"] { overflow: hidden; max-height: none; padding-bottom: 8px; }
  .cm-dock[data-sheet="closed"] > :not(.cm-head) { display: none; }
  .cm-dock[data-sheet="closed"] .cm-head { margin-bottom: 0; }
  .cm-dock[data-sheet="closed"] .cm-head > :not(.cm-title) { display: none; }
  .ps-shell:is([data-view="3d"],[data-view="walk"]) .cm-strip { left: 8px; right: 8px; max-width: none; }
  .cm-strip { left: 8px; right: 8px; top: 8px; bottom: auto; transform: none; max-width: none; overflow-x: auto; border-radius: 10px; }
  .cm-cell { padding: 5px 10px; min-width: 64px; flex: none; }
  .cm-cell b { font-size: 14px; }
  .cm-cell i { font-size: 10px; max-width: 110px; }
  .ps-stage[data-commercial="1"] .ps-credit { bottom: 62px; }
  .ps-stage[data-commercial="1"] .pso-dock { bottom: 94px; }
  .ps-stage[data-commercial="1"]:has(.gf-backpill:not([hidden])) .pso-dock { bottom: 142px; }
  .ps-stage[data-commercial="1"][data-sheet="open"] .pso-dock, .ps-stage[data-commercial="1"][data-sheet="open"] .ps-credit { display: none; }
}

/* Hide / show the side panel ------------------------------------------------------------------------------------------------ */
.ps-panel[hidden] { display: none; }
.ps-shell[data-panel="hidden"] .ps-main { grid-template-columns: 54px minmax(0, 1fr) 0; }
.ps-shell[data-panel="hidden"]:is([data-view="3d"], [data-view="walk"]) .ps-main { grid-template-columns: 0 minmax(0, 1fr) 0; }
.ps-panel-tab {
  position: absolute; right: 0; top: 46%; z-index: 6; display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 28px; min-height: 84px; padding: 8px 4px; border: 1px solid var(--ps-border-strong); border-right: 0; border-radius: 8px 0 0 8px;
  background: var(--ps-panel); color: var(--ps-text); font: 600 12px/1 var(--ps-font); cursor: pointer; box-shadow: var(--ps-shadow, 0 2px 8px rgb(0 0 0 / 0.18));
}
.ps-panel-tab:hover { background: var(--ps-hover); color: var(--ps-accent); }
.ps-panel-tab:focus-visible, .ps-panel-hide:focus-visible { outline: 2px solid var(--ps-accent); outline-offset: 2px; }
.ps-panel-tab-text { writing-mode: vertical-rl; letter-spacing: 0.04em; }
.ps-panel-tab[hidden] { display: none; }
/* The builder turned the assistant off for clients: no tab, no section, nothing to open. */
.ps-shell[data-ai="off"] .ps-tab[data-tab="ai"], .ps-shell[data-ai="off"] .ps-tab-ai { display: none !important; }
@media (max-width: 899.98px) {
  .ps-shell[data-panel="hidden"] .ps-main { grid-template-columns: none; }
  .ps-panel-hide .ps-icon, .ps-panel-hide svg { transform: rotate(90deg); }
  .ps-panel-tab { top: auto; bottom: 10px; right: 10px; min-height: 36px; min-width: 44px; flex-direction: row; padding: 6px 12px; border: 1px solid var(--ps-border-strong); border-radius: 999px; }
  .ps-panel-tab svg { transform: rotate(90deg); }
  .ps-panel-tab-text { writing-mode: horizontal-tb; }
}
@media print { .ps-panel-tab { display: none; } }

/* 3D, Split and Walk: the floating stats strip and the tips chip stay out of the way (the numbers are in the Plan view and the side panel). */
.ps-shell:is([data-view="3d"], [data-view="split"], [data-view="walk"]) .cm-strip { display: none; }
.ps-shell:is([data-view="split"], [data-view="walk"]) .ps-hintbar { display: none; }
.ps-shell:is([data-view="split"], [data-view="walk"]) .ps-stage[data-commercial="1"] .ps-credit { bottom: 12px; }
/* Walk: an open "Arrange / Place house" session is suspended (its overlay and bar would catch the clicks that start looking around); it returns with the Plan view. */
.ps-shell[data-view="walk"] .pas-catch, .ps-shell[data-view="walk"] .pas-pose { display: none !important; }
.ps-shell[data-view="split"] .pso-dock, .ps-shell[data-view="split"] .ps3d-hints { display: none; }

/* The way back to the main page is always labelled. */
.ps-shell .ps-topbar .ps-back .ps-btn-text { display: inline !important; }
.ps-shell .ps-topbar .ps-back.ps-btn--wide:has(.ps-btn-text) { width: auto !important; padding: 0 10px !important; }
/* Save design is always labelled. */
.ps-shell .ps-topbar .ps-prof-save .ps-prof-save-text { display: inline !important; }
.ps-shell .ps-topbar .ps-prof-save:has(.ps-prof-save-text) { width: auto !important; padding: 0 11px !important; }

/* Rotate tool: the panel over the plan, the live readout and the 1 degree box (src/editor2d/tool-rotate.js) */
.ps-rot-box { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; max-width: calc(100% - 24px); padding: 8px 10px; border-radius: 12px; background: var(--ps-panel); border: 1px solid var(--ps-border-strong); box-shadow: var(--ps-shadow); font-size: 12.5px; z-index: 6; }
.ps-rot-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ps-rot-head { gap: 8px; }
.ps-rot-sel { font-weight: 600; }
.ps-rot-facing { color: var(--ps-muted); font-variant-numeric: tabular-nums; }
.ps-rot-label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.ps-rot-input { width: 72px; min-height: 36px; padding: 0 8px; border: 1px solid var(--ps-border-strong); border-radius: 8px; background: var(--ps-canvas); color: var(--ps-text); font: inherit; font-variant-numeric: tabular-nums; }
.ps-rot-btn { min-height: 36px; padding: 0 12px; border: 1px solid var(--ps-border-strong); border-radius: 8px; background: var(--ps-panel); color: var(--ps-text); font: inherit; font-weight: 600; cursor: pointer; }
.ps-rot-btn:hover:not(:disabled) { background: var(--ps-hover); }
.ps-rot-btn[aria-pressed="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }
.ps-rot-btn:disabled, .ps-rot-input:disabled { opacity: 0.45; cursor: default; }
.ps-rot-hint { color: var(--ps-muted); font-size: 12px; max-width: 460px; }
.ps-rot-chip { position: absolute; display: flex; flex-direction: column; align-items: flex-start; padding: 5px 10px; border-radius: 10px; background: rgba(26,28,32,0.92); color: #fff; box-shadow: var(--ps-shadow); pointer-events: none; z-index: 7; font-variant-numeric: tabular-nums; }
.ps-rot-chip strong { font-size: 18px; line-height: 1.1; }
.ps-rot-chip small { font-size: 11px; opacity: 0.85; }
.ps-rot-chip[data-snap="lot"], .ps-rot-chip[data-snap="frontage"] { background: #17724a; }

</style>

.ps-prof-btn .ps-prof-dot{display:none}
.ps-prof-btn[data-state="in"] .ps-prof-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ps-ok);margin-left:2px}
.ps-prof-save-text{display:inline;font-weight:600}.ps-shell .ps-topbar .ps-btn.ps-prof-save{height:40px;padding:0 16px!important;margin-right:8px;border-radius:8px;background:#1f7a4d!important;border-color:#1f7a4d!important;color:#fff!important;font-size:15px;gap:6px}.ps-shell .ps-topbar .ps-btn.ps-prof-save:hover{background:#18643f!important}.ps-shell .ps-topbar .ps-btn.ps-prof-save .ps-icon{color:#fff}.ps-shell .ps-topbar .ps-prof-save:has(.ps-prof-save-text){width:auto;padding:0 11px}

.gf-open .ps-prof-prompt{position:fixed;z-index:950;top:64px;bottom:auto}
.ps-prof-prompt{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:40;width:min(380px,calc(100% - 32px));padding:14px 14px 12px;background:var(--ps-panel);color:var(--ps-text);border:1px solid var(--ps-border-strong);border-left:4px solid var(--ps-accent);border-radius:var(--ps-radius-lg);box-shadow:var(--ps-shadow,0 6px 24px rgba(0,0,0,.2));animation:ps-toast-in .18s ease-out}
.ps-prof-prompt h2{margin:0 0 4px;font-size:16px;font-weight:600}
.ps-prof-prompt p{margin:0 0 10px;font-size:14px;color:var(--ps-muted)}
.ps-prof-prompt .ps-prof-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ps-prof-prompt .ps-prof-x{position:absolute;top:6px;right:6px}
.ps-prof-tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--ps-border)}
.ps-prof-tab{padding:8px 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ps-muted);font-weight:600;font-size:14px}
.ps-prof-tab[aria-selected="true"]{color:var(--ps-text);border-bottom-color:var(--ps-accent)}
.ps-prof-form{display:grid;gap:10px}
.ps-prof-form label.ps-prof-lab{display:block;font-size:13px;font-weight:600;margin:0 0 3px}
.ps-prof-form .ps-prof-opt{font-weight:400;color:var(--ps-muted)}
.ps-prof-form .ps-input,.ps-prof-form .ps-select{width:100%}
.ps-prof-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.ps-prof-grid{grid-template-columns:1fr}}
.ps-prof-pw{display:flex;gap:6px}
.ps-prof-pw .ps-input{flex:1;min-width:0}
.ps-prof-meter{display:flex;gap:3px;margin:6px 0 0}
.ps-prof-meter i{flex:1;height:4px;border-radius:2px;background:var(--ps-border)}
.ps-prof-meter[data-score="1"] i:nth-child(-n+1){background:var(--ps-danger)}
.ps-prof-meter[data-score="2"] i:nth-child(-n+2){background:var(--ps-warning)}
.ps-prof-meter[data-score="3"] i:nth-child(-n+3){background:var(--ps-ok)}
.ps-prof-meter[data-score="4"] i{background:var(--ps-ok)}
.ps-prof-check{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4}
.ps-prof-check input{margin-top:2px;flex:0 0 auto}
.ps-prof-err{margin:0;padding:8px 10px;background:var(--ps-danger-soft);color:var(--ps-danger);border-radius:var(--ps-radius);font-size:13px}
.ps-prof-err[hidden]{display:none}
.ps-prof-note{margin:0;font-size:13px;color:var(--ps-muted)}
.ps-prof-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ps-prof-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:8px;background:var(--ps-field);border:1px solid var(--ps-border);border-radius:var(--ps-radius)}
.ps-prof-thumb{width:96px;height:60px;border-radius:var(--ps-radius-sm);background:var(--ps-panel-2);border:1px solid var(--ps-border);object-fit:cover;display:grid;place-items:center;color:var(--ps-faint);font-size:11px}
.ps-prof-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ps-muted);margin:2px 0 6px}
.ps-prof-name{font-weight:600;font-size:15px;color:var(--ps-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-prof-row .ps-prof-actions{display:flex;gap:6px;flex-wrap:wrap}
.ps-prof-count{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:13px;color:var(--ps-muted)}
.ps-prof-sec{padding:12px 0;border-top:1px solid var(--ps-border)}
.ps-prof-sec:first-child{border-top:0;padding-top:0}
.ps-prof-sec h3{margin:0 0 6px;font-size:14px;font-weight:600}
.ps-prof-status{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ps-prof-status[data-state="error"],.ps-prof-status[data-state="limit"]{color:var(--ps-danger)}
.ps-prof-status button{border:0;background:transparent;color:inherit;text-decoration:underline;padding:0;font:inherit}
@media (max-width:599.98px){.ps-prof-prompt{right:8px;left:8px;width:auto;transform:none;top:56px}}

.lc-mini-hint{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font:500 9px var(--lc-sans);color:#fff;background:rgba(10,10,12,.72);text-align:center;opacity:0;pointer-events:none;transition:opacity .15s}
.lc-mini:hover .lc-mini-hint{opacity:1}
@media (hover:none){.lc-mini-hint{display:none}}
@media (max-width:640px){.lc-plan{width:110px;height:74px}.lc-stats{gap:10px}.lc-btn{height:34px;padding:0 12px!important}}

/* Embedded viewer (the home page frame): the Lot Planner layout. Tag and compass top left, address search and menu top right, the design card
   bottom left, the design switcher bottom centre, the top view bottom right, microtext along the bottom. */
.lc-embed .lc-head{left:14px;top:14px;max-width:calc(100% - 430px);padding:10px 14px 11px;border-radius:12px;background:rgba(10,10,12,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-shadow:none}
.lc-embed .lc-head-t{font-size:13px;letter-spacing:.26em}
.lc-embed .lc-head-s{margin-top:7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-compass{position:absolute;left:14px;top:72px;width:38px;height:38px;border-radius:50%;display:flex!important;align-items:center;justify-content:center}
.lc-compass svg{width:26px;height:26px}
.lc-compass:hover,.lc-menu:hover{background:rgba(40,40,46,.85)}
.lc-embed .lc-find{right:64px;top:14px;height:42px;width:min(340px,calc(100% - 520px));max-width:none;padding:0 16px!important;border-radius:21px;gap:10px}
.lc-embed .lc-find-in{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--lc-t1);font:500 13.5px var(--lc-sans);padding:0}
.lc-embed .lc-find-in::placeholder{color:var(--lc-t1);opacity:.92}
.lc-embed .lc-find:focus-within{border-color:rgba(255,255,255,.55)}
.lc-find-list{position:absolute;left:0;right:0;top:48px;margin:0;padding:6px;list-style:none;border-radius:14px;max-height:280px;overflow:auto;z-index:6}
.lc-find-list[hidden]{display:none}
.lc-find-item{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font:500 12.5px var(--lc-sans)}
.lc-find-item i{font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--lc-t2)}
.lc-find-item:hover,.lc-find-item[aria-selected=true]{background:rgba(255,255,255,.14)}
.lc-menu{position:absolute;right:14px;top:14px;width:42px;height:42px;border-radius:50%;display:flex!important;align-items:center;justify-content:center}
.lc-menu-list{position:absolute;right:14px;top:62px;width:230px;padding:6px;border-radius:14px;z-index:7;display:flex;flex-direction:column}
.lc-menu-list[hidden]{display:none}
.lc-menu-item{text-align:left;padding:10px 12px!important;border-radius:9px;font:500 13px var(--lc-sans)}
.lc-menu-item:hover{background:rgba(255,255,255,.14)}
.lc-foot{position:absolute;left:16px;bottom:6px;font:400 9.5px/1 var(--lc-sans);letter-spacing:.02em;color:rgba(255,255,255,.62);text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none}
.lc-embed:not(.is-compact) .lc-card{left:14px;bottom:26px;width:clamp(380px,calc(50% - 168px),590px);padding:20px 24px 0;border-radius:16px}
.lc-embed:not(.is-compact) .lc-stats{gap:18px;margin:12px 0 8px}
.lc-embed:not(.is-compact) .lc-stats b{font-size:25px}
.lc-embed:not(.is-compact) .lc-sp{margin:6px 0 8px}
.lc-embed:not(.is-compact) .lc-sp .lc-k{width:62px}
.lc-embed:not(.is-compact) .lc-sp-rooms .lc-tabs{flex-wrap:wrap}
.lc-embed:not(.is-compact) .lc-tab{height:32px;padding:0 15px!important;font-size:13px}
.lc-embed:not(.is-compact) .lc-acts{gap:8px 10px}
.lc-embed:not(.is-compact) .lc-gh{padding:0 4px!important}
.lc-embed:not(.is-compact) .lc-fit{min-height:40px;margin-top:2px;font-size:12.5px}
.lc-embed:not(.is-compact) .lc-pager{left:50%;right:auto;transform:translateX(-50%);width:auto;bottom:26px;justify-content:center}
.lc-embed:not(.is-compact) .lc-pgt{min-width:150px;max-width:300px;flex:none;font-size:10.5px;letter-spacing:.16em}
.lc-embed:not(.is-compact) .lc-mini{bottom:26px;right:14px;width:min(18%,200px)}
.lc-embed.is-compact .lc-find{display:flex;left:12px;right:62px;top:12px;width:auto;height:40px}
.lc-embed.is-compact .lc-menu{right:12px;top:12px;width:40px;height:40px}
.lc-embed.is-compact .lc-menu-list{top:58px;right:12px}
.lc-embed.is-compact .lc-head{left:12px;top:60px;max-width:calc(100% - 130px);padding:7px 10px 8px}
.lc-embed.is-compact .lc-head-t{font-size:11px}
.lc-embed.is-compact .lc-compass{left:12px;top:104px;width:34px;height:34px}
.lc-embed.is-compact .lc-rooms{top:150px}
.lc-embed.is-compact .lc-find-list{top:46px}
.lc-embed.is-phone .lc-foot{display:none}
.lc-embed.is-compact .lc-foot{left:12px;bottom:3px}
.lc-embed.is-compact .lc-card .lc-gh{padding:0 6px!important}
/* The two PDF links share one row. */
.lc-zone{margin-top:4px;padding:6px 10px;border-radius:8px;background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.45);color:#ffd68a;font:500 11.5px var(--lc-sans)}.lc-zone[hidden]{display:none}
.lc-links{display:inline-flex;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.lc-dotsep{color:var(--lc-t2);padding:0 2px}
.lc-links .lc-gh{padding:0 4px!important}
/* Busy states: the pager while a design is placed, the search pill while an address loads. */
.lc-pager.is-busy{opacity:.78}
.lc-pager.is-busy button{cursor:progress}
.lc-find.is-busy{opacity:.8}
/* Phone and compact: the switcher rides just above the card (open or closed) so it is never hidden or covered; the room pills fade at a clipped edge. */
.lc-embed.is-compact .lc-pager{bottom:calc(var(--lc-card-h, 100px) + 12px)}
.lc-embed.is-compact:has(.lc-card.is-open) .lc-pager:not([hidden]){display:flex}
.lc-embed.is-compact .lc-rooms .lc-tabs{scrollbar-width:none;padding-right:2px}
.lc-embed.is-compact .lc-rooms .lc-tabs::-webkit-scrollbar{display:none}
.lc-embed.is-compact .lc-rooms .lc-tabs.has-more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.lc-embed.is-compact .lc-rooms .lc-tabs.has-more.has-less{-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 36px),transparent)}
.lc-embed.is-compact .lc-rooms .lc-tabs.has-less:not(.has-more){-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px);mask-image:linear-gradient(90deg,transparent,#000 24px)}
/* Send the plans to a registered engineer: a clear button under the PDF links (desktop and phone). */
.lc-send{margin-top:8px}.lc-send[hidden],.lc-sendbtn[hidden]{display:none}
.lc-sendbtn{border-color:rgba(255,200,61,.75)!important;color:#ffd77a!important;height:38px}
.lc-sendbtn:hover{background:rgba(255,200,61,.14)}
.lc-root.is-phone .lc-send{margin-top:6px}.lc-root.is-phone .lc-sendbtn{width:100%;white-space:normal;line-height:1.15;height:auto;min-height:36px;padding:6px 12px!important}
.lc-root[data-room="1"]:not(.is-compact) .lc-card .lc-send{display:none}
.ps-toast button{white-space:normal}

/* Compact card and minimise (owner 15/11/2026: the card covered the plan) */
.lc-card{width:min(430px,calc(100% - 24px));padding:12px 16px 0;border-radius:12px}
.lc-title{font-size:20px}
.lc-sub{margin-top:3px;font-size:11.5px}
.lc-stats{gap:14px;margin:8px 0 6px}.lc-stats b{font-size:17px}.lc-stats i{margin-top:3px;font-size:9px}
.lc-sp{margin:3px 0 4px}.lc-sp .lc-k{width:58px}.lc-k{font-size:9.5px}
.lc-chip{width:24px;height:24px}.lc-sw{width:19px;height:19px}
.lc-acts{gap:6px;margin-top:8px}
.lc-btn{height:30px;padding:0 12px!important;font-size:12px;border-radius:15px}
.lc-fit{min-height:30px;font-size:11.5px}
.lc-card:has(.lc-fit[hidden]) .lc-acts{margin-bottom:12px}
.lc-min{flex:none;width:28px;height:28px;border-radius:14px;border:1px solid rgba(255,255,255,.22)!important;display:inline-flex;align-items:center;justify-content:center;font:600 16px/1 var(--lc-sans)}
.lc-min:hover{background:rgba(255,255,255,.1)}
.lc-card.is-min{width:max-content;max-width:calc(100% - 24px);padding:8px 10px 8px 14px}
.lc-card.is-min .lc-body,.lc-card.is-min .lc-sub,.lc-card.is-min .lc-more{display:none!important}
.lc-card.is-min .lc-title{font-size:15px}
.lc-card.is-min .lc-hd{align-items:center}

.tv-ov{position:fixed;inset:0;z-index:8;background:rgba(6,8,10,.55);display:block}
.tv-dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:94vw;height:90vh;min-width:0;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;background:rgba(14,16,18,.96);border:1px solid rgba(255,255,255,.22);box-shadow:0 18px 60px rgba(0,0,0,.55);color:#fff}
.tv-bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid rgba(255,255,255,.14)}
.tv-title{margin:0;font:600 11px/1 var(--lc-sans,system-ui,sans-serif);letter-spacing:.2em;white-space:nowrap}
.tv-sub{flex:1;min-width:0;font:400 12px/1.3 var(--lc-sans,system-ui,sans-serif);color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-btns{flex:none;display:flex;gap:6px}
.tv-btn{min-width:40px;height:40px;padding:0 10px!important;border-radius:20px;border:1px solid rgba(255,255,255,.3)!important;background:rgba(255,255,255,.06)!important;color:#fff;font:600 18px/1 var(--lc-sans,system-ui,sans-serif);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.tv-btn:hover{background:rgba(255,255,255,.16)!important}
.tv-btn:focus-visible,.tv-svg:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tv-btn.tv-fit,.tv-btn.tv-n{font-size:12px;letter-spacing:.06em}
.tv-btn[aria-pressed="true"].tv-n{background:rgba(255,255,255,.22)!important}
.tv-warn{flex:none;margin:0;padding:6px 14px;font:600 12px/1.3 var(--lc-sans,system-ui,sans-serif);color:#bfe3c5;background:rgba(40,90,50,.35)}
.tv-warn[data-state="warn"]{color:#ffd0cc;background:rgba(190,40,40,.4)}
.tv-btn.tv-mode{font-size:12px;border-radius:20px;white-space:nowrap}
.tv-btn.tv-t90{font-size:13px;white-space:nowrap}
.tv-btn[hidden]{display:none}
.tv-hs-host[hidden]{display:none}
.tv-hs{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.14);background:rgba(199,162,86,.12)}
.tv-hs .tv-btn{height:32px;font-size:12px}
.tv-hs .tv-btn[aria-pressed="true"]{background:rgba(199,162,86,.45)!important;border-color:#c7a256!important}
.tv-hs-type{height:32px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:#1b1e22;color:#fff;font:600 12px var(--lc-sans,system-ui,sans-serif);padding:0 10px}
.tv-hs-note{font:600 12px var(--lc-sans,system-ui,sans-serif);color:#f3e2b4;cursor:help}
.tv-hs-hint{flex-basis:100%;font:400 11px/1.3 var(--lc-sans,system-ui,sans-serif);color:rgba(255,255,255,.7)}
.tv-btn:disabled{opacity:.4;cursor:default}
.tv-stage{position:relative;flex:1;min-height:0;background:#e8ece7}
.tv-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tv-svg.is-drag{cursor:grabbing}
.tv-north{position:absolute;right:12px;top:12px;width:48px;height:48px;pointer-events:none}
.tv-scale{position:absolute;left:12px;bottom:12px;pointer-events:none;font:600 11px var(--lc-sans,system-ui,sans-serif);color:#1d242b;text-shadow:0 0 3px #fff,0 0 3px #fff}
.tv-scale i{display:block;height:6px;border:2px solid #1d242b;border-top:0;margin-top:2px;box-sizing:border-box}
.tv-help{flex:none;margin:0;padding:6px 14px 8px;font:400 11px/1.3 var(--lc-sans,system-ui,sans-serif);color:rgba(255,255,255,.62)}
.tv-live{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lc-mini{cursor:grab;touch-action:none}
.lc-mini-reset{position:absolute;left:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:rgba(10,10,12,.78)!important;border:1px solid rgba(255,255,255,.55)!important;display:flex;align-items:center;justify-content:center;color:#fff;padding:0;cursor:pointer}
.lc-mini-reset[hidden]{display:none}
.lc-mini-reset svg{width:15px;height:15px}
.lc-mini-x{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:rgba(10,10,12,.78)!important;border:1px solid rgba(255,255,255,.55)!important;display:flex;align-items:center;justify-content:center;color:#fff}
.lc-mini-x:hover{background:rgba(10,10,12,.95)!important}
.lc-mini-x svg{width:14px;height:14px}
.lc-root.is-compact .lc-mini-x{width:26px;height:26px;right:4px;bottom:4px}
.lc-mini-hint{padding-right:40px!important}
@media (max-width:640px){.tv-sub{display:none}.tv-btns{margin-left:auto;gap:3px;flex-wrap:wrap;justify-content:flex-end}.tv-btn{min-width:34px;height:34px;padding:0 6px!important}.tv-bar{gap:6px;padding:8px}.tv-bar .ps-aerial{height:34px;padding:0 10px 0 8px!important}}

.gf-finder{margin:0 0 16px}
.gf-finder-h{margin:0 0 4px;font-size:16px}
.gf-finder-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;max-width:620px}
.gf-finder-item{display:flex;align-items:center;gap:12px;border:1px solid var(--gf-border);border-radius:10px;padding:8px 10px}
.gf-finder-logo{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.gf-finder-logo--blank{display:grid;place-items:center;background:var(--gf-acc-soft);color:var(--gf-acc);font-weight:700}
.gf-finder-meta{display:flex;flex-direction:column;flex:1;min-width:0}
.gf-finder-form{display:grid;gap:8px;max-width:520px;margin-top:10px;position:relative}
.gf-finder-f{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:13px}
.gf-finder-f input{border:1px solid var(--gf-border);border-radius:8px;padding:9px 11px;font:inherit;background:var(--ps-field,#fff);color:var(--gf-text);min-height:40px}
.gf-finder-consent{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.gf-finder-consent input{width:18px;height:18px;margin-top:2px;flex:none}
.gf-finder-nl{margin-top:10px;display:grid;gap:6px}
@media (max-width:640px){.gf-finder-item{flex-wrap:wrap}.gf-finder-item .gf-btn{flex:1}}
`;var Fb=`
.ps-modal-root{z-index:1000} /* dialogs opened from a step (Add building) stand above the flow */
.gf-root{--gf-bg:var(--ps-bg,#f1f2f4);--gf-panel:var(--ps-panel,#fff);--gf-text:var(--ps-text,#1a1c20);--gf-muted:var(--ps-muted,#5a5e66);--gf-border:var(--ps-border,#dcdde0);
 --gf-acc:var(--ps-accent,#1b4fd1);--gf-acc-ink:var(--ps-accent-ink,#fff);--gf-acc-soft:var(--ps-accent-soft,#e6ecfb);--gf-ok:var(--ps-ok,#17724a);--gf-ok-soft:var(--ps-ok-soft,#dbefe4);
 --gf-warn:var(--ps-warning,#935800);--gf-warn-soft:var(--ps-warning-soft,#f7e9cc);--gf-bad:var(--ps-danger,#b52828);
 position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;background:var(--gf-bg);color:var(--gf-text);font:14px/1.45 var(--ps-font-ui,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif)}
.gf-root[hidden]{display:none}
.gf-root *{box-sizing:border-box}
.gf-root button{font:inherit;cursor:pointer}
.gf-root button:focus-visible,.gf-root input:focus-visible,.gf-root select:focus-visible{outline:2px solid var(--gf-acc);outline-offset:2px}
.gf-head{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--gf-panel);border-bottom:1px solid var(--gf-border)}
.gf-brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.gf-prog{display:flex;flex:1;gap:4px;margin:0;padding:0;list-style:none;justify-content:center;min-width:0}
.gf-prog li{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;color:var(--gf-muted);font-weight:600;white-space:nowrap}
.gf-prog li button{all:unset;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:999px}
.gf-prog li button:focus-visible{outline:2px solid var(--gf-acc);outline-offset:3px}
.gf-prog li[data-state="todo"] button{cursor:default}
.gf-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--gf-border);font-size:12px;flex:none}
.gf-prog li[data-state="done"]{color:var(--gf-text)}
.gf-prog li[data-state="done"] .gf-num{background:var(--gf-ok);border-color:var(--gf-ok);color:#fff}
.gf-prog li[data-state="current"]{color:var(--gf-acc);background:var(--gf-acc-soft)}
.gf-prog li[data-state="current"] .gf-num{background:var(--gf-acc);border-color:var(--gf-acc);color:var(--gf-acc-ink)}
.gf-help{margin-left:auto}.gf-help+.gf-skip{margin-left:0}
.gf-skip{margin-left:auto;background:none;border:0;color:var(--gf-muted);text-decoration:underline;padding:6px;white-space:nowrap}
.gf-body{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;flex-direction:column}
.gf-wrap{width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.gf-title{margin:0 0 4px;font-size:24px;line-height:1.2}
.gf-intro{margin:0 0 16px;color:var(--gf-muted);max-width:70ch}
.gf-foot{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--gf-panel);border-top:1px solid var(--gf-border)}
.gf-foot .gf-count{margin-right:auto;color:var(--gf-muted);font-size:12px}
.gf-btn{border:1px solid var(--gf-border);background:var(--gf-panel);color:var(--gf-text);border-radius:8px;padding:10px 18px;font-weight:600;min-height:44px}
.gf-btn:hover:not(:disabled){background:var(--ps-hover,#eeeff1)}
.gf-btn:disabled{opacity:.5;cursor:not-allowed}
.gf-btn--primary{background:var(--gf-acc);border-color:var(--gf-acc);color:var(--gf-acc-ink)}
.gf-btn--primary:hover:not(:disabled){background:var(--gf-acc);filter:brightness(1.08)}
.gf-btn--sm{min-height:36px;padding:6px 12px}
.gf-card{background:var(--gf-panel);border:1px solid var(--gf-border);border-radius:12px;padding:16px}
.gf-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.gf-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gf-field{display:flex;gap:8px;position:relative}
.gf-field input{flex:1;min-width:0;border:1px solid var(--gf-border);border-radius:8px;padding:11px 12px;font:inherit;background:var(--ps-field,#fff);color:var(--gf-text);min-height:44px}
.gf-suggest{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--gf-panel);border:1px solid var(--gf-border);border-radius:8px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.gf-suggest li{padding:10px 12px;border-radius:6px;cursor:pointer}
.gf-suggest li:hover,.gf-suggest li[aria-selected="true"]{background:var(--gf-acc-soft)}
.gf-note{margin:8px 0 0;color:var(--gf-muted);font-size:13px}
.gf-note--bad{color:var(--gf-bad)}
.gf-spin{display:inline-block;width:16px;height:16px;margin-right:8px;vertical-align:-3px;border:2px solid var(--gf-muted,#8a8f98);border-top-color:var(--gf-accent,#1b4fd1);border-radius:50%;animation:gf-spin .8s linear infinite}
@keyframes gf-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.gf-spin{animation:none;border-top-color:var(--gf-muted,#8a8f98);border-style:dotted}}
.gf-dim{opacity:.35;pointer-events:none;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){.gf-dim{transition:none}}
.gf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0 0}
.gf-stat{border:1px solid var(--gf-border);border-radius:10px;padding:10px 12px}
.gf-stat b{display:block;font-size:20px;line-height:1.2}
.gf-stat span{color:var(--gf-muted);font-size:12px}
.gf-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--gf-acc-soft);color:var(--gf-acc)}
.gf-chip--ok{background:var(--gf-ok-soft);color:var(--gf-ok)}
.gf-chip--warn{background:var(--gf-warn-soft);color:var(--gf-warn)}
.gf-map{width:100%;height:auto;max-height:min(52vh,540px);display:block;background:#e9efe3;border-radius:10px;border:1px solid var(--gf-border)}
.gf-map-wrap{position:relative}
.gf-filters{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 14px}
.gf-filters label{display:flex;align-items:center;gap:8px;font-weight:600}
.gf-filters select{border:1px solid var(--gf-border);border-radius:8px;padding:8px 10px;font:inherit;background:var(--ps-field,#fff);color:var(--gf-text);min-height:40px}
.gf-homes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gf-home{text-align:left;border:2px solid var(--gf-border);border-radius:12px;background:var(--gf-panel);color:inherit;padding:0;overflow:hidden;display:flex;flex-direction:column}
.gf-home:hover{border-color:var(--gf-acc)}
.gf-home[aria-pressed="true"]{border-color:var(--gf-acc);box-shadow:0 0 0 3px var(--gf-acc-soft)}
.gf-home img{display:block;width:100%;height:auto;background:#f3f4ef;aspect-ratio:8/5;object-fit:contain}
.gf-home-b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gf-home-b strong{font-size:16px}
.gf-home-s{color:var(--gf-muted);font-size:13px}
.gf-empty{padding:24px;text-align:center;color:var(--gf-muted)}
.gf-stage{position:relative;border:1px solid var(--gf-border);border-radius:12px;background:#dfe7d6;overflow:hidden;touch-action:none;flex:1;min-height:320px}
.gf-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.gf-zoom{position:absolute;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:calc(100% - 16px);z-index:3}
.gf-zb{height:30px;min-width:30px;padding:0 9px;border-radius:15px;border:1px solid var(--gf-border,#d3dad4);background:rgba(255,255,255,.94);color:#16211d;font:600 12px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.gf-zb:hover:not(:disabled){border-color:#1b4fd1}.gf-zb:disabled{opacity:.55;cursor:default}
.gf-stage .gf-house{cursor:grab}
.gf-stage .gf-house:active{cursor:grabbing}
.gf-stage .gf-bld{cursor:grab}
.gf-stage .gf-bld:active{cursor:grabbing}
.gf-seg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.gf-seg .gf-btn[aria-pressed="true"]{border-color:var(--gf-acc);background:var(--gf-acc-soft);font-weight:700}
.gf-type[disabled]{opacity:.6}
.gf-handle{cursor:crosshair}
.gf-place{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 300px;flex:1;min-height:0}
.gf-side{display:flex;flex-direction:column;gap:12px}
.gf-place--fit{grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"coach fit" "stage fit" "stage side"}
.gf-place--fit>.gf-coachrow{grid-area:coach;min-width:0}
.gf-place--fit>.gf-stage{grid-area:stage}
.gf-place--fit>.gf-fitwrap{grid-area:fit;display:flex;flex-direction:column;gap:10px;min-width:0}
.gf-place--fit>.gf-side{grid-area:side}
.gf-coachrow.gf-wait,.gf-coachrow:empty,.gf-coachrow:not(:has(.fitcoach:not([hidden]))){display:none}
@keyframes gf-breach{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.gf-breach{animation:gf-breach 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.gf-breach{animation:none}}
.gf-status{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-weight:600}
.gf-status[data-state="inside"]{background:var(--gf-ok-soft);color:var(--gf-ok)}
.gf-status[data-state="outside"]{background:var(--gf-warn-soft);color:var(--gf-warn)}
.gf-status[data-state="unknown"],.gf-status[data-state="none"]{background:var(--gf-acc-soft);color:var(--gf-text)}
.gf-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gf-ctl .gf-btn{padding:8px 6px;min-height:44px}
.gf-pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center}
.gf-pad .gf-btn{padding:0;min-height:0;font-size:18px}
.gf-pad .gf-mid{grid-column:2;grid-row:2;font-size:11px;color:var(--gf-muted);display:grid;place-items:center}
.gf-check{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);flex:1;min-height:0}
.gf-3d{position:relative;border:1px solid var(--gf-border);border-radius:12px;overflow:hidden;background:#cfd8e0;min-height:320px}
.gf-3d>.ps3d-root,.gf-3d>div{position:absolute;inset:0}
.gf-table{width:100%;border-collapse:collapse;font-size:13px}
.gf-table th,.gf-table td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--gf-border)}
.gf-lines{margin:12px 0 0;padding:0 0 0 18px}
.gf-lines li{margin:4px 0}
.gf-resume{position:absolute;left:12px;top:12px;z-index:30}
.gf-backpill{position:absolute;left:12px;bottom:88px;z-index:30;border:1px solid var(--ps-border,#dcdde0);background:var(--ps-panel,#fff);color:var(--ps-text,#1a1c20);border-radius:999px;padding:8px 16px;font:600 13px var(--ps-font-ui,system-ui,sans-serif);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;min-height:40px}
.gf-backpill:hover{border-color:var(--ps-accent,#1b4fd1)}
/* Narrow screens: the pill moves up under the Back to plan button, clear of the 3D view chips (Street view, Front, Aerial) at the bottom left. */
@media (max-width:599.98px){.gf-backpill{top:52px;bottom:auto;left:12px;padding:5px 12px;min-height:32px;font-size:12px}}
/* With the lot card open over the 3D view the pill goes to the top left column too, so it never sits on the card's buttons. */
.ps-stage:has(.lc-root:not([hidden])) .gf-backpill{top:108px;bottom:auto;left:12px}
.gf-kinds{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.gf-kind-ic{font-size:12px;color:var(--gf-muted)}

.gf-types{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gf-typecard{text-align:left;border:2px solid var(--gf-border);border-radius:12px;background:var(--gf-panel);color:inherit;padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;font:inherit;min-height:44px}
.gf-typecard:hover{border-color:var(--gf-acc)}
.gf-typecard[aria-pressed="true"]{border-color:var(--gf-acc);box-shadow:0 0 0 3px var(--gf-acc-soft)}
.gf-typecard-b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gf-typecard-s{color:var(--gf-muted);font-size:13px}
@media (max-width:900px){
 .gf-grid,.gf-place,.gf-check{grid-template-columns:minmax(0,1fr)}
 .gf-place--fit{grid-template-rows:auto;grid-template-areas:"coach" "fit" "stage" "side"}
 .gf-stage{min-height:300px;flex:none;height:46vh}
 .gf-3d{min-height:280px;height:38vh;flex:none}
}
@media (max-width:640px){
 .gf-head{padding:8px 12px;gap:8px;flex-wrap:wrap}
 .gf-brand{font-size:13px}
 .gf-prog{order:3;flex-basis:100%;justify-content:space-between;gap:0}
 .gf-prog li{padding:2px 4px}
 .gf-prog li:not([data-state="current"]) .gf-lbl{display:none}
 .gf-body{padding:14px 12px}
 .gf-title{font-size:20px}
 .gf-foot{padding:10px 12px}
 .gf-foot .gf-count{display:none}
 .gf-foot .gf-btn{flex:1}
 .gf-homes,.gf-types{grid-template-columns:minmax(0,1fr)}
}
