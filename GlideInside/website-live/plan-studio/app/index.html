.tv-ov{position:fixed;inset:0;z-index:8;background:rgba(6,8,10,.55);display:block}
.tv-dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:94vw;height:90vh;min-width:0;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;background:rgba(14,16,18,.96);border:1px solid rgba(255,255,255,.22);box-shadow:0 18px 60px rgba(0,0,0,.55);color:#fff}
.tv-bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid rgba(255,255,255,.14)}
.tv-title{margin:0;font:600 11px/1 var(--lc-sans,system-ui,sans-serif);letter-spacing:.2em;white-space:nowrap}
.tv-sub{flex:1;min-width:0;font:400 12px/1.3 var(--lc-sans,system-ui,sans-serif);color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-btns{flex:none;display:flex;gap:6px}
.tv-btn{min-width:40px;height:40px;padding:0 10px!important;border-radius:20px;border:1px solid rgba(255,255,255,.3)!important;background:rgba(255,255,255,.06)!important;color:#fff;font:600 18px/1 var(--lc-sans,system-ui,sans-serif);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.tv-btn:hover{background:rgba(255,255,255,.16)!important}
.tv-btn:focus-visible,.tv-svg:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tv-btn.tv-fit,.tv-btn.tv-n{font-size:12px;letter-spacing:.06em}
.tv-btn[aria-pressed="true"].tv-n{background:rgba(255,255,255,.22)!important}
.tv-warn{flex:none;margin:0;padding:6px 14px;font:600 12px/1.3 var(--lc-sans,system-ui,sans-serif);color:#bfe3c5;background:rgba(40,90,50,.35)}
.tv-warn[data-state="warn"]{color:#ffd0cc;background:rgba(190,40,40,.4)}
.tv-btn.tv-mode{font-size:12px;border-radius:20px;white-space:nowrap}
.tv-btn.tv-t90{font-size:13px;white-space:nowrap}
.tv-btn[hidden]{display:none}
.tv-hs-host[hidden]{display:none}
.tv-hs{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.14);background:rgba(199,162,86,.12)}
.tv-hs .tv-btn{height:32px;font-size:12px}
.tv-hs .tv-btn[aria-pressed="true"]{background:rgba(199,162,86,.45)!important;border-color:#c7a256!important}
.tv-hs-type{height:32px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:#1b1e22;color:#fff;font:600 12px var(--lc-sans,system-ui,sans-serif);padding:0 10px}
.tv-hs-note{font:600 12px var(--lc-sans,system-ui,sans-serif);color:#f3e2b4;cursor:help}
.tv-hs-hint{flex-basis:100%;font:400 11px/1.3 var(--lc-sans,system-ui,sans-serif);color:rgba(255,255,255,.7)}
.tv-btn:disabled{opacity:.4;cursor:default}
.tv-stage{position:relative;flex:1;min-height:0;background:#e8ece7}
.tv-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tv-svg.is-drag{cursor:grabbing}
.tv-north{position:absolute;right:12px;top:12px;width:48px;height:48px;pointer-events:none}
.tv-scale{position:absolute;left:12px;bottom:12px;pointer-events:none;font:600 11px var(--lc-sans,system-ui,sans-serif);color:#1d242b;text-shadow:0 0 3px #fff,0 0 3px #fff}
.tv-scale i{display:block;height:6px;border:2px solid #1d242b;border-top:0;margin-top:2px;box-sizing:border-box}
.tv-help{flex:none;margin:0;padding:6px 14px 8px;font:400 11px/1.3 var(--lc-sans,system-ui,sans-serif);color:rgba(255,255,255,.62)}
.tv-live{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lc-mini{cursor:grab;touch-action:none}
.lc-mini-reset{position:absolute;left:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:rgba(10,10,12,.78)!important;border:1px solid rgba(255,255,255,.55)!important;display:flex;align-items:center;justify-content:center;color:#fff;padding:0;cursor:pointer}
.lc-mini-reset[hidden]{display:none}
.lc-mini-reset svg{width:15px;height:15px}
.lc-mini-x{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:rgba(10,10,12,.78)!important;border:1px solid rgba(255,255,255,.55)!important;display:flex;align-items:center;justify-content:center;color:#fff}
.lc-mini-x:hover{background:rgba(10,10,12,.95)!important}
.lc-mini-x svg{width:14px;height:14px}
.lc-root.is-compact .lc-mini-x{width:26px;height:26px;right:4px;bottom:4px}
.lc-mini-hint{padding-right:40px!important}
.tv-btn.tv-close-top{display:none}
html.tv-open .gf-backpill,html.tv-open .ps-rot-box,html.tv-open .gf-resume{display:none!important}
@media (max-width:640px){.tv-sub{display:none}.tv-bar{flex-wrap:wrap;gap:6px 8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px))}.tv-title{flex:1 1 auto}.tv-bar .ps-aerial{height:44px;padding:0 12px 0 10px!important}.tv-btn.tv-close-top{display:inline-flex;min-width:88px;height:44px;font-size:15px;order:2}.tv-btns{flex:1 1 100%;order:3;margin:0;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.tv-btns::-webkit-scrollbar{display:none}.tv-btns .tv-close{display:none}.tv-btn{min-width:44px;height:44px;padding:0 10px!important;flex:none}}
@media (max-width:640px),(max-height:480px){.tv-dlg{left:0;top:0;transform:none;width:100%;height:100%;border-radius:0;border:0}.tv-help{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:no-preference){.tv-ov{animation:tvfade .16s ease-out}@keyframes tvfade{from{opacity:0}to{opacity:1}}}

/* The phone house screen (src/phone/house-ui.js): the website's navy and gold. */
html[data-phone="1"]{--ph-navy:#0a111e;--ph-navy-2:#121b2b;--ph-gold:#e9b66f;--ph-gold-2:#f3c98d;--ph-ink:#1c1407;--ph-on:#ffffff;--ph-on-2:#a9b3c4;--ph-line:rgba(255,255,255,.16)}
.ph-steps{display:flex;gap:6px;margin:0;padding:0;list-style:none;width:100%}
.ph-steps li{flex:1;min-width:0}
.ph-steps li>*{all:unset;display:flex;flex-direction:column;gap:3px;width:100%;box-sizing:border-box}
.ph-steps li button{cursor:pointer;min-height:44px;justify-content:center}
.ph-seg{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.ph-lbl{font:600 10.5px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ph-on-2,#a9b3c4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-steps li[data-state="done"] .ph-seg{background:rgba(233,182,111,.55)}
.ph-steps li[data-state="current"] .ph-seg{background:var(--ph-gold,#e9b66f)}
.ph-steps li[data-state="current"] .ph-lbl{color:var(--ph-gold,#e9b66f)}
.ph-bar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--ph-navy-2,#121b2b);color:var(--ph-on,#fff);border-top:1px solid var(--ph-line);box-shadow:0 -8px 24px rgba(0,0,0,.35);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.ph-bar *{box-sizing:border-box}
.ph-name{font:600 16px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph-bar .ph-btn{height:44px;min-height:44px;padding:0 6px;border-radius:12px;border:1px solid var(--ph-line);background:var(--ph-navy,#0a111e);color:var(--ph-on,#fff);font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;white-space:nowrap}
.ph-bar .ph-btn[aria-pressed="true"]{border-color:var(--ph-gold,#e9b66f);color:var(--ph-gold,#e9b66f);background:rgba(233,182,111,.12)}
.ph-bar .ph-btn:disabled,.ph-bar .ph-plans:disabled{opacity:.5}
.ph-bar .ph-plans{width:100%;height:52px;min-height:52px;border:0;border-radius:14px;background:var(--ph-gold,#e9b66f);color:var(--ph-ink,#1c1407);font:700 17px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
.ph-bar .ph-plans:active{background:var(--ph-gold-2,#f3c98d)}
.ph-bar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ph-rotate{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-rotate[hidden]{display:none}
.ph-bar .ph-turn{height:44px;border-radius:12px;border:1px solid var(--ph-gold,#e9b66f);background:rgba(233,182,111,.12);color:var(--ph-gold,#e9b66f);font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
.ph-pill{display:flex;align-items:center;gap:8px;height:40px;min-width:0;padding:0 14px;border-radius:20px;background:rgba(10,17,30,.88);border:1px solid var(--ph-line);color:var(--ph-on,#fff);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ph-menu-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--ph-line);background:rgba(10,17,30,.88);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ph-concept{margin:6px 2px 0;font-size:12px;color:var(--ph-on-2,#a9b3c4);text-align:center}
.ph-menu-rooms{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border:1px solid var(--ps-border,#dcdde0);border-radius:12px}
.ph-chips{display:flex;flex-wrap:wrap;gap:8px}
.ph-chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--ps-border,#dcdde0);background:transparent;color:inherit;font:600 14px system-ui,sans-serif;cursor:pointer}
/* The sheets that open from the phone house screen are navy too. */
html[data-phone="1"] .ps-sheet:has(.ph-menu){background:#121b2b;color:#fff}
html[data-phone="1"] .ps-sheet:has(.ph-menu) .ps-sheet-close{color:#e9b66f}
html[data-phone="1"] .ps-sheet:has(.ph-menu) .ps-sheet-item{background:#0a111e;color:#fff;border-color:rgba(255,255,255,.16)}
html[data-phone="1"] .ps-sheet:has(.ph-menu) .ps-sheet-item small{color:#a9b3c4}
html[data-phone="1"] .ps-sheet:has(.ph-menu) .ps-sheet-item[aria-pressed="true"]{border-color:#e9b66f;background:rgba(233,182,111,.14)}
html[data-phone="1"] .ps-sheet:has(.ph-menu) .ph-menu-rooms{border-color:rgba(255,255,255,.16);background:#0a111e}
html[data-phone="1"] .ps-sheet:has(.ph-menu) .ph-chip{border-color:rgba(255,255,255,.28)}
html[data-phone="1"] .ps-sheet:has(.ph-menu) .ph-chip:active{border-color:#e9b66f;color:#e9b66f}

.cc-root .lc-title{font-size:24px}
.cc-feas{margin:4px 0 8px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--lc-line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cc-feas-t{flex:1 1 220px;min-width:0;font:500 12.5px/1.35 var(--lc-sans);color:var(--lc-t1)}
.cc-feas-t b{font:400 19px/1.1 var(--lc-serif);margin-right:6px;white-space:nowrap}
.cc-feas-t div{display:flex;align-items:baseline;flex-wrap:wrap;margin:1px 0}
.cc-land{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 6px;font:500 12.5px var(--lc-sans)}
.cc-land input{width:130px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:inherit;padding:0 10px;font:500 13px var(--lc-sans)}
.cc-feas-t i{font-style:normal;color:var(--lc-t2)}
.cc-feas .lc-btn{height:32px;font-size:12px;padding:0 14px!important}
.cc-feas[hidden]{display:none}
.cc-summary{flex:1 1 100%;margin:2px 0 0;font:500 12px/1.4 var(--lc-sans);color:var(--lc-t1)}
.cc-summary[data-tone="note"]{color:var(--lc-t2)}
.cc-summary[hidden]{display:none}
.cc-root .lc-sp .lc-k{width:68px}
.cc-root .lc-fit,.lc-embed:not(.is-compact).cc-root .lc-fit{min-height:0;margin-top:0;padding:0;line-height:1.5}
.cc-fits{margin:6px 0 14px;display:flex;flex-direction:column;gap:2px}
.cc-root .lc-tab{height:30px;padding:0 12px!important;font-size:12.5px}
.cc-root .lc-sp-rooms .lc-k{padding-top:6px}
.cc-root .lc-tabs{gap:6px;flex-wrap:wrap}
.cc-fits .lc-fit[hidden]{display:none}
.lc-embed:not(.is-compact).cc-root .lc-card{width:var(--cc-w,380px)}
.cc-root .lc-pager{height:50px;border-radius:25px}
.cc-pgt{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0!important;max-width:none!important;flex:1;padding:0 4px;text-transform:none!important;letter-spacing:0!important;cursor:pointer}
.cc-pgt i{font:500 9.5px/1 var(--lc-sans);font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--lc-t2)}
.cc-pgt b{font:500 12.5px/1.2 var(--lc-sans);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-root .lc-pager button.cc-pgt{width:auto;height:auto;border-radius:12px;line-height:1.2}
.lc-embed:not(.is-compact).cc-root .lc-pager{left:calc(var(--cc-w,380px) + 28px);right:auto;transform:none;width:auto;min-width:300px;max-width:calc(100% - var(--cc-w,380px) - min(18%,200px) - 64px);justify-content:space-between}

.cc-typebar{position:absolute;z-index:2;display:flex;align-items:center;height:46px;border-radius:23px;padding:0 6px 0 4px}
.lc-embed:not(.is-compact).cc-root .cc-typebar{left:calc(var(--cc-w,380px) + 28px);bottom:84px;min-width:300px}

.cc-ty-t i{font:500 9.5px/1 var(--lc-sans);font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--lc-t2)}
.cc-ty-t b{font:500 12.5px/1.2 var(--lc-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-types{position:absolute;bottom:54px;left:0;right:0;padding:6px;border-radius:14px;z-index:6;min-width:260px;max-height:min(70vh,560px);overflow:auto}
.cc-types[hidden]{display:none}
.lc-root[data-view="2d"] .cc-typebar,.lc-root[data-view="split"] .cc-typebar{display:none!important}

.cc-types button:hover,.cc-types button[aria-current=true]{background:rgba(255,255,255,.14)}
.cc-list{position:absolute;bottom:60px;left:0;right:0;margin:0;padding:6px;list-style:none;border-radius:14px;z-index:6;min-width:260px}
.cc-list[hidden]{display:none}
.cc-list button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:9px 12px!important;border-radius:9px;font:500 12.5px var(--lc-sans)}

.cc-list button i{font-style:normal;color:var(--lc-t2);font-size:11px}
.cc-panel{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(580px,calc(100% - 24px));max-height:calc(100% - 140px);overflow:auto;padding:16px 18px 18px;border-radius:16px;z-index:8;color:var(--lc-t1)}

.cc-panel th{padding:6px 8px;text-align:left;font:500 10px var(--lc-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--lc-t2);border-bottom:1px solid var(--lc-line)}
.cc-panel td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07)}

.cc-line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07);font:400 12.5px/1.35 var(--lc-sans)}
.cc-line b{font-weight:600;white-space:nowrap}
.cc-line i{display:block;font-style:normal;color:var(--lc-t2);font-size:11px}
.cc-note{margin:10px 0 0;font:400 11.5px/1.45 var(--lc-sans);color:var(--lc-t2)}
.cc-panel .lc-btn{height:34px;font-size:12px;margin-top:12px}
.cc-root.is-compact .lc-fit{font-size:11.5px}
.cc-root.is-phone .lc-tab{padding:0 8px!important;font-size:11.5px;height:28px}

.cc-root.is-phone .cc-line{font-size:12px}

.cc-root .lc-zone{font-size:11px;padding:6px 10px;margin-top:6px}

 position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;background:var(--gf-bg);color:var(--gf-text);font:14px/1.45 var(--ps-font-ui,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif)}

@media (max-width:900px){
 .gf-grid,.gf-place,.gf-check{grid-template-columns:minmax(0,1fr)}
 .gf-place--fit{grid-template-rows:auto;grid-template-areas:"coach" "fit" "stage" "side"}
 .gf-stage{min-height:300px;flex:none;height:46vh}
 .gf-3d{min-height:280px;height:38vh;flex:none}
}
@media (max-width:640px){
 .gf-head{padding:8px 12px;gap:8px;flex-wrap:wrap}
 .gf-brand{font-size:13px}
 .gf-prog{order:3;flex-basis:100%;justify-content:space-between;gap:0}
 .gf-prog li{padding:2px 4px}
 .gf-prog li:not([data-state="current"]) .gf-lbl{display:none}
 .gf-body{padding:14px 12px}
 .gf-title{font-size:20px}
 .gf-foot{padding:10px 12px}
 .gf-foot .gf-count{display:none}
 .gf-foot .gf-btn{flex:1}
 .gf-homes,.gf-types{grid-template-columns:minmax(0,1fr)}
}
