<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan Studio</title>
<meta name="description" content="Draw a floor plan, see it in 3D and walk through it. Houses, granny flats, units, sheds and extensions.">
<!-- GI_CONFIG (portalEnabled, portalMock) comes from the site config; the portal stays closed if this file is missing -->
<script src="../../site.config.js?v=20261111"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Plan Studio. Drafting-table tool. All colours are --ps-* tokens (docs/SCOPE.md 10.4). */

:root {
  --ps-font-ui: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --ps-font-label: 'Barlow Condensed', 'Arial Narrow', 'Barlow', system-ui, sans-serif;
  --ps-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ps-radius: 5px;
  --ps-radius-sm: 4px;
  --ps-radius-lg: 6px;

  --ps-bg: #f1f2f4;
  --ps-canvas: #ffffff;
  --ps-panel: #ffffff;
  --ps-panel-2: #f5f5f6;
  --ps-field: #ffffff;
  --ps-hover: #eeeff1;

  --ps-text: #1a1c20;
  --ps-muted: #5a5e66;
  --ps-faint: #686c74;

  --ps-border: #dcdde0;
  --ps-border-strong: #b6b8bd;

  --ps-accent: #1b4fd1;
  --ps-accent-ink: #ffffff;
  --ps-accent-soft: #e6ecfb;
  --ps-focus: #1b4fd1;

  --ps-ok: #17724a;
  --ps-ok-soft: #dbefe4;
  --ps-warning: #935800;
  --ps-warning-soft: #f7e9cc;
  --ps-danger: #b52828;
  --ps-danger-soft: #f7dada;
  --ps-on-status: #ffffff;

  --ps-grid-minor: rgba(0, 0, 0, 0.045);
  --ps-grid-major: rgba(0, 0, 0, 0.11);
  --ps-ink: #1a1c20;
  --ps-wall-existing: #8c9097;
  --ps-wall-demolish: #cf3535;
  --ps-line: #2c2f36;
  --ps-line-soft: #80848c;
  --ps-dim: #4d5560;
  --ps-room-a: rgba(90, 96, 106, 0.06);
  --ps-room-b: rgba(25, 150, 165, 0.12);
  --ps-room-c: rgba(120, 90, 200, 0.09);
  --ps-room-d: rgba(130, 134, 142, 0.16);
  --ps-room-outdoor: rgba(30, 140, 85, 0.45);
  --ps-ghost-ok: rgba(27, 79, 209, 0.55);
  --ps-ghost-bad: rgba(181, 40, 40, 0.65);

  --ps-shadow: 0 10px 30px rgba(20, 22, 26, 0.20);
  --ps-scrim: rgba(16, 18, 22, 0.42);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --ps-bg: #08111d;
  --ps-canvas: #0b1a2e;
  --ps-panel: #0f2037;
  --ps-panel-2: #132a46;
  --ps-field: #0a1829;
  --ps-hover: #183456;

  --ps-text: #e3f0f8;
  --ps-muted: #94abc2;
  --ps-faint: #7f98b4;

  --ps-border: #224060;
  --ps-border-strong: #365d86;

  --ps-accent: #6b99ff;
  --ps-accent-ink: #06142e;
  --ps-accent-soft: #173360;
  --ps-focus: #8fb2ff;

  --ps-ok: #4cc58a;
  --ps-ok-soft: #123a2b;
  --ps-warning: #e9b24c;
  --ps-warning-soft: #3d2f10;
  --ps-danger: #ff7a7a;
  --ps-danger-soft: #451c20;
  --ps-on-status: #08111d;

  --ps-grid-minor: rgba(120, 185, 255, 0.07);
  --ps-grid-major: rgba(120, 185, 255, 0.17);
  --ps-ink: #e2f4fb;
  --ps-wall-existing: #6f88a3;
  --ps-wall-demolish: #ff6b6b;
  --ps-line: #bfe3f2;
  --ps-line-soft: #6b90aa;
  --ps-dim: #7cc4ec;
  --ps-room-a: rgba(110, 170, 255, 0.07);
  --ps-room-b: rgba(70, 210, 220, 0.09);
  --ps-room-c: rgba(170, 140, 255, 0.09);
  --ps-room-d: rgba(160, 185, 210, 0.10);
  --ps-room-outdoor: rgba(90, 210, 150, 0.45);
  --ps-ghost-ok: rgba(143, 178, 255, 0.65);
  --ps-ghost-bad: rgba(255, 122, 122, 0.75);

  --ps-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  --ps-scrim: rgba(2, 8, 18, 0.62);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ps-bg);
  color: var(--ps-text);
  font-family: var(--ps-font-ui);
  font-size: 14px;
  line-height: 1.35;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

#app {
  height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}

:focus-visible { outline: 2px solid var(--ps-focus); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
svg { display: block; }

.ps-mono { font-family: var(--ps-font-mono); font-variant-numeric: tabular-nums; }
.ps-label {
  font-family: var(--ps-font-label);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ps-muted);
}
.ps-boot { margin: 24px 0; color: var(--ps-muted); font-family: var(--ps-font-label); letter-spacing: 0.08em; text-transform: uppercase; }
.ps-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell layout ------------------------------------------------------------ */
.ps-shell {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--ps-panel);
  border: 1px solid var(--ps-border-strong);
  border-radius: var(--ps-radius-lg);
  overflow: hidden;
  position: relative;
}
.ps-main {
  min-height: 0;
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr) 328px;
  border-top: 1px solid var(--ps-border);
}
.ps-stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--ps-canvas);
  overflow: hidden;
}
.ps-plan-host, .ps-3d-host { position: absolute; inset: 0; }
/* Split view: plan left, live 3D right (stacked on narrow screens), a draggable divider between (src/ui/views.js sets --ps-split). */
.ps-shell { --ps-split: 50%; }
.ps-shell[data-view="split"] .ps-plan-host { right: auto; width: var(--ps-split); }
.ps-shell[data-view="split"] .ps-3d-host { left: var(--ps-split); }
.ps-split-bar {
  position: absolute; top: 0; bottom: 0; left: var(--ps-split); width: 12px; margin-left: -6px; z-index: 30;
  cursor: col-resize; touch-action: none; display: flex; align-items: center; justify-content: center; outline: none;
}
.ps-split-bar::before { content: ''; position: absolute; top: 0; bottom: 0; left: 5px; width: 2px; background: var(--ps-border-strong); }
.ps-split-bar:hover::before, .ps-split-bar:focus-visible::before, .ps-split-bar.is-dragging::before { background: var(--ps-accent); }
.ps-split-grip { position: relative; width: 6px; height: 40px; border-radius: 3px; background: var(--ps-panel); border: 1px solid var(--ps-border-strong); }
.ps-split-bar.is-dragging .ps-split-grip, .ps-split-bar:focus-visible .ps-split-grip { border-color: var(--ps-accent); }
.ps-shell.is-splitting .ps-plan-host, .ps-shell.is-splitting .ps-3d-host { pointer-events: none; }
.ps-shell.is-splitting { cursor: col-resize; user-select: none; }
.ps-backplan { position: absolute; top: 12px; left: 12px; z-index: 31; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
.ps-shell[data-view="split"] .ps-backplan { left: calc(var(--ps-split) + 12px); }
.ps-back .ps-btn-text { font-weight: 600; }
/* In the split view the frontage prompt belongs to the plan pane. */
.ps-shell[data-view="split"] .ps-frontage { left: calc(var(--ps-split) / 2); width: min(520px, calc(var(--ps-split) - 24px)); }
.ps-topbar > .ps-back { margin-right: 2px; }
@media (max-width: 899.98px) {
  .ps-shell[data-view="split"] .ps-plan-host { right: 0; bottom: auto; width: auto; height: var(--ps-split); }
  .ps-shell[data-view="split"] .ps-3d-host { left: 0; top: var(--ps-split); }
  .ps-split-bar { top: var(--ps-split); bottom: auto; left: 0; right: 0; width: auto; height: 14px; margin: -7px 0 0; cursor: row-resize; }
  .ps-split-bar::before { top: 6px; bottom: auto; left: 0; right: 0; width: auto; height: 2px; }
  .ps-split-grip { width: 40px; height: 6px; }
  .ps-shell[data-view="split"] .ps-backplan { left: 12px; top: calc(var(--ps-split) + 12px); }
  .ps-shell.is-splitting { cursor: row-resize; }
  .ps-back .ps-btn-text { display: none; }
  .ps-back:has(.ps-btn-text) { width: 32px; padding: 0; }
}
.ps-plan-host { overflow: hidden; touch-action: none; }
.ps-3d-host { background: var(--ps-canvas); }
.ps-plan-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.ps-plan-overlay { position: absolute; inset: 0; pointer-events: none; }
.ps-plan-overlay > * { pointer-events: auto; }

/* Top bar ------------------------------------------------------------------ */
.ps-topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 8px 12px;
  background: var(--ps-panel);
  min-width: 0;
}
.ps-brand { display: flex; align-items: center; gap: 8px; }
.ps-logo {
  width: 22px; height: 22px; flex: none;
  border: 2px solid var(--ps-accent);
  border-radius: 3px;
  position: relative;
}
.ps-logo::before, .ps-logo::after { content: ''; position: absolute; background: var(--ps-accent); }
.ps-logo::before { left: 5px; top: -2px; bottom: 7px; width: 2px; }
.ps-logo::after { left: -2px; right: 5px; top: 7px; height: 2px; }
.ps-product {
  font-family: var(--ps-font-label);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.ps-name {
  width: 176px;
  max-width: 100%;
  height: 32px;
  padding: 0 9px;
  background: var(--ps-field);
  border: 1px solid transparent;
  border-radius: var(--ps-radius-sm);
  font-weight: 500;
  font-size: 15px;
  text-overflow: ellipsis;
}
.ps-name:hover { border-color: var(--ps-border); }
.ps-name:focus { border-color: var(--ps-accent); }
.ps-group { display: flex; align-items: center; gap: 4px; }
.ps-topbar-spacer { flex: 1 1 0; min-width: 0; }
.ps-premium-slot { display: flex; align-items: center; gap: 8px; min-height: 32px; margin-left: auto; flex: 0 0 auto; white-space: nowrap; }
@media (max-width: 1699.98px) { .ps-product { font-size: 14px; letter-spacing: 0.03em; } .ps-name { width: 110px; } .ps-topbar { gap: 8px; } .ps-shell .ps-topbar .ps-back .ps-btn-text { display: none !important; } .ps-shell .ps-topbar .ps-back.ps-btn--wide:has(.ps-btn-text) { width: 32px !important; padding: 0 !important; } }
/* Below 1560px the topbar must stay on one row in 3D (the Roof chip adds a control): the logo mark stands in for the product name and the gaps tighten. */
@media (max-width: 1559.98px) { .ps-product { display: none; } .ps-name { width: 100px; } .ps-topbar { gap: 6px; } }
/* Two level designs add Ground / First / All and the Roof chip: from 1440 down, Find my block shows its icon only, the level tabs and chips are compact and the gaps tighten so the bar stays on one row. */
@media (min-width: 901px) and (max-width: 1559.98px) {
  .ps-topbar { gap: 4px 6px; padding: 8px 10px; }
  .ps-shell .ps-topbar [data-action="find-block"] .ps-btn-text { display: none !important; }
  .ps-shell .ps-topbar [data-action="find-block"].ps-btn--wide:has(.ps-btn-text) { width: 32px !important; padding: 0 !important; }
  .ps-topbar .ps-levels { gap: 3px; flex-wrap: nowrap; }
  .ps-topbar .ps-level-tab { height: 28px; padding: 0 8px; max-width: 112px; } /* wide enough for Mezzanine */
  .ps-topbar .ps-level-tab:not(.ps-level-add) { min-width: 0; }
  .ps-topbar .ps-seg-btn { padding: 0 9px; }
  .ps-premium-slot { gap: 6px; }
  .ps-premium-slot .ps-btn { padding: 0 9px; }
}

/* Buttons and segmented controls ------------------------------------------ */
.ps-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 11px;
  background: var(--ps-field);
  color: var(--ps-text);
  border: 1px solid var(--ps-border-strong);
  border-radius: var(--ps-radius);
  font-weight: 500;
  white-space: nowrap;
}
.ps-btn:hover:not(:disabled) { background: var(--ps-hover); }
.ps-btn:disabled { opacity: 0.45; }
.ps-btn svg { width: 18px; height: 18px; flex: none; }
.ps-btn[aria-pressed="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }
.ps-btn--primary { background: var(--ps-accent); border-color: var(--ps-accent); color: var(--ps-accent-ink); }
.ps-btn--primary:hover:not(:disabled) { background: var(--ps-accent); filter: brightness(1.08); }
.ps-btn--ghost { background: transparent; border-color: transparent; }
.ps-btn--icon { width: 32px; padding: 0; }
.ps-btn--danger { color: var(--ps-danger); border-color: var(--ps-danger); }
.ps-btn--sm { height: 26px; padding: 0 8px; font-size: 13px; }

.ps-seg {
  display: inline-flex;
  border: 1px solid var(--ps-border-strong);
  border-radius: var(--ps-radius);
  overflow: hidden;
  background: var(--ps-field);
  flex: none;
}
.ps-seg-btn {
  height: 30px; padding: 0 12px;
  background: transparent; border: 0; border-right: 1px solid var(--ps-border);
  font-weight: 500; color: var(--ps-muted); white-space: nowrap;
}
.ps-seg-btn:last-child { border-right: 0; }
.ps-seg-btn:hover { background: var(--ps-hover); color: var(--ps-text); }
.ps-seg-btn[aria-selected="true"], .ps-seg-btn[aria-pressed="true"] { background: var(--ps-accent); color: var(--ps-accent-ink); }
.ps-seg-btn:disabled { opacity: 0.4; }
.ps-seg--sm .ps-seg-btn { height: 26px; padding: 0 9px; font-size: 13px; }

.ps-levels { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ps-level-tab {
  height: 30px; padding: 0 11px;
  background: transparent;
  border: 1px solid var(--ps-border);
  border-radius: var(--ps-radius);
  font-weight: 500; color: var(--ps-muted);
}
.ps-level-tab:hover { background: var(--ps-hover); color: var(--ps-text); }
.ps-level-tab[aria-selected="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }
.ps-level-add { border-style: dashed; }
.ps-level-tab { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-level-tab:not(.ps-level-add) { min-width: 44px; }

/* The toolbox only belongs to the plan view. Explicit columns keep the stage in place without it. */
.ps-toolbox { grid-column: 1; }
.ps-stage { grid-column: 2; }
.ps-panel { grid-column: 3; }
.ps-shell:is([data-view="3d"], [data-view="walk"]) .ps-main { grid-template-columns: 0 minmax(0, 1fr) 328px; }
.ps-shell:is([data-view="3d"], [data-view="walk"]) .ps-toolbox { display: none; }
.ps-shell[data-mode="demo"] .ps-tab[data-tab="ai"] { display: none; }
.ps-panel .ps-seg { display: flex; width: 100%; }
.ps-panel .ps-seg .ps-seg-btn { flex: 1 1 auto; min-width: 0; padding: 0 6px; }

/* Toolbox ------------------------------------------------------------------ */
.ps-toolbox {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 8px 0;
  background: var(--ps-panel);
  border-right: 1px solid var(--ps-border);
  overflow-y: auto;
  min-height: 0;
}
.ps-tool-sep { width: 28px; height: 1px; background: var(--ps-border); margin: 4px 0; flex: none; }
.ps-tool {
  position: relative;
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  background: transparent; border: 1px solid transparent; border-radius: var(--ps-radius);
  color: var(--ps-text);
}
.ps-tool svg { width: 22px; height: 22px; }
.ps-tool:hover { background: var(--ps-hover); }
.ps-tool[aria-pressed="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }
.ps-tool-key {
  position: absolute; right: 3px; bottom: 1px;
  font-family: var(--ps-font-mono); font-size: 9px; line-height: 1;
  color: var(--ps-faint);
}
.ps-tool[aria-pressed="true"] .ps-tool-key { color: var(--ps-accent); }

/* Stage overlays ------------------------------------------------------------ */
.ps-stage-note {
  position: absolute; inset: 0; z-index: 3;
  display: grid; place-items: center; text-align: center;
  background: var(--ps-canvas); padding: 24px;
}
.ps-stage-note > div { max-width: 360px; }
.ps-spinner {
  width: 22px; height: 22px; margin: 0 auto 10px;
  border: 2px solid var(--ps-border-strong); border-top-color: var(--ps-accent);
  border-radius: 50%;
  animation: ps-spin 0.9s linear infinite;
}
@keyframes ps-spin { to { transform: rotate(360deg); } }

.ps-hintbar {
  position: absolute; left: 12px; top: 10px; z-index: 2;
  max-width: calc(100% - 24px);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  pointer-events: none;
}
.ps-hintbar > * { pointer-events: auto; }
.ps-chip-note {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: 999px;
  font-size: 13px; color: var(--ps-text);
}
.ps-chip-note .ps-mono { font-size: 12px; }

.ps-welcome {
  position: absolute; left: 50%; top: 50%; z-index: 40;
  transform: translate(-50%, -50%);
  width: min(460px, calc(100% - 24px));
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px;
  background: var(--ps-panel);
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
  box-shadow: var(--ps-shadow);
}
.ps-welcome h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.ps-welcome p { margin: 0 0 8px; color: var(--ps-muted); }
.ps-welcome-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ps-welcome-find { height: 48px; padding: 0 22px; font-size: 16px; font-weight: 600; flex: 1 1 100%; justify-content: center; gap: 10px; }

/* Furniture drawer ----------------------------------------------------------- */
.ps-drawer {
  position: absolute; left: 0; top: 0; bottom: 0; z-index: 5;
  width: min(316px, 100%);
  display: flex; flex-direction: column;
  background: var(--ps-panel);
  border-right: 1px solid var(--ps-border-strong);
  box-shadow: var(--ps-shadow);
}
.ps-drawer-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px; }
.ps-drawer-head h3 { margin: 0; flex: 1; font-size: 15px; font-weight: 600; }
.ps-drawer-search { padding: 0 10px 8px; }
.ps-cats { display: flex; gap: 4px; padding: 0 10px 8px; overflow-x: auto; flex: none; scrollbar-width: thin; }
.ps-cat {
  flex: none; height: 26px; padding: 0 10px;
  background: transparent; border: 1px solid var(--ps-border); border-radius: 999px;
  color: var(--ps-muted); font-size: 13px; font-weight: 500;
}
.ps-cat:hover { background: var(--ps-hover); }
.ps-cat[aria-pressed="true"] { background: var(--ps-accent); border-color: var(--ps-accent); color: var(--ps-accent-ink); }
.ps-tiles {
  flex: 1; min-height: 0; overflow-y: auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px;
  padding: 4px 10px 12px; align-content: start;
}
.ps-tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 4px 6px;
  background: var(--ps-field); border: 1px solid var(--ps-border); border-radius: var(--ps-radius);
  font-size: 12px; line-height: 1.15; text-align: center; color: var(--ps-text);
}
.ps-tile:hover { border-color: var(--ps-accent); }
.ps-tile[aria-pressed="true"] { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
.ps-tile canvas { width: 64px; height: 64px; }
.ps-empty { padding: 18px 12px; color: var(--ps-muted); text-align: center; }

/* Popovers (in page, never alert/confirm/prompt) ----------------------------- */
.ps-popover {
  position: absolute; z-index: 6;
  width: 272px; max-width: calc(100% - 16px);
  padding: 12px;
  background: var(--ps-panel);
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
  box-shadow: var(--ps-shadow);
}
.ps-popover h4 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.ps-popover .ps-field { margin-bottom: 8px; }
.ps-popover-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.ps-hatch-note { margin: 0 0 8px; font-size: 13px; color: var(--ps-muted); }

/* Right panel ----------------------------------------------------------------- */
.ps-panel {
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background: var(--ps-panel);
  border-left: 1px solid var(--ps-border);
}
.ps-panel-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--ps-border); }
.ps-tabs { display: flex; gap: 2px; flex: 1; }
.ps-tab {
  height: 30px; padding: 0 12px;
  background: transparent; border: 0; border-bottom: 2px solid transparent;
  font-family: var(--ps-font-label); font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ps-muted);
}
.ps-tab:hover { color: var(--ps-text); }
.ps-tab[aria-selected="true"] { color: var(--ps-accent); border-bottom-color: var(--ps-accent); }
.ps-sheet-toggle { display: none; }
.ps-panel-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px; }
.ps-panel-body > section { min-width: 0; }

.ps-sec { margin: 0 0 16px; }
.ps-sec > h3, .ps-sec-title {
  margin: 0 0 8px;
  font-family: var(--ps-font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ps-muted);
  display: flex; align-items: center; gap: 8px;
}
.ps-sec > h3::after { content: ''; flex: 1; height: 1px; background: var(--ps-border); }
.ps-sel-title { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; }
.ps-sel-title strong { font-size: 16px; font-weight: 600; }
.ps-sel-title span { color: var(--ps-muted); font-size: 13px; }

.ps-field { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; margin-bottom: 7px; }
.ps-field > label, .ps-field > .ps-field-label {
  font-family: var(--ps-font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--ps-muted); line-height: 1.15;
}
.ps-field--stack { grid-template-columns: minmax(0, 1fr); gap: 4px; }
.ps-input, .ps-select, .ps-textarea {
  width: 100%; height: 30px; padding: 0 8px;
  background: var(--ps-field); color: var(--ps-text);
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-sm);
  min-width: 0;
}
.ps-input:hover:not(:disabled), .ps-select:hover:not(:disabled) { border-color: var(--ps-faint); }
.ps-input:disabled, .ps-select:disabled { opacity: 0.55; }
.ps-input:focus, .ps-select:focus { border-color: var(--ps-accent); outline-offset: 0; }
.ps-input[type="number"], .ps-input.ps-num { font-family: var(--ps-font-mono); font-variant-numeric: tabular-nums; }
.ps-input-wrap { position: relative; }
.ps-input-wrap .ps-input { padding-right: 34px; }
.ps-unit { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--ps-font-mono); font-size: 11px; color: var(--ps-faint); pointer-events: none; }
.ps-check { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; min-height: 26px; }
.ps-check input { width: 16px; height: 16px; accent-color: var(--ps-accent); margin: 0; }
.ps-range { width: 100%; accent-color: var(--ps-accent); }
.ps-readout { font-family: var(--ps-font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.ps-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ps-row > .ps-btn { flex: 1 1 auto; }
.ps-hint { margin: 0 0 10px; color: var(--ps-muted); font-size: 13px; }
.ps-note-box { padding: 8px 10px; border: 1px solid var(--ps-border); border-radius: var(--ps-radius); background: var(--ps-panel-2); color: var(--ps-muted); font-size: 13px; margin-bottom: 10px; }

.ps-radio-row { display: grid; gap: 6px; margin-bottom: 10px; }
.ps-radio {
  display: flex; align-items: center; gap: 8px; padding: 6px 9px;
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius); background: var(--ps-field);
  text-align: left; width: 100%;
}
.ps-radio[aria-pressed="true"] { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
.ps-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--ps-border-strong); flex: none; }
.ps-swatch--new { background: var(--ps-ink); }
.ps-swatch--existing { background: var(--ps-wall-existing); }
.ps-swatch--demolish { background: transparent; border: 1px dashed var(--ps-wall-demolish); }

/* Summary tables ---------------------------------------------------------------- */
.ps-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ps-table th {
  text-align: left; padding: 3px 4px;
  font-family: var(--ps-font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ps-muted);
  border-bottom: 1px solid var(--ps-border-strong);
}
.ps-table td { padding: 4px; border-bottom: 1px solid var(--ps-border); vertical-align: top; }
.ps-table .num { text-align: right; font-family: var(--ps-font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ps-table tr.total td { font-weight: 600; border-top: 1px solid var(--ps-border-strong); }
.ps-table tr.clickable { cursor: pointer; }
.ps-table tr.clickable:hover td { background: var(--ps-hover); }
.ps-level-block { margin-bottom: 12px; }
.ps-level-block h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }

.ps-warns { display: grid; gap: 6px; }
.ps-warn {
  display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left;
  padding: 6px 8px; background: var(--ps-warning-soft); color: var(--ps-text);
  border: 1px solid var(--ps-warning); border-radius: var(--ps-radius); font-size: 13px;
}
.ps-warn svg { width: 16px; height: 16px; flex: none; color: var(--ps-warning); margin-top: 1px; }
.ps-ok-note { display: flex; gap: 8px; align-items: center; color: var(--ps-ok); font-size: 13px; }
.ps-ok-note svg { width: 16px; height: 16px; }

.ps-ai-mount { min-height: 80px; }
.ps-ai-fallback { padding: 14px; border: 1px dashed var(--ps-border-strong); border-radius: var(--ps-radius-lg); color: var(--ps-muted); }

/* Status bar ----------------------------------------------------------------------- */
.ps-statusbar {
  display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap;
  padding: 5px 12px;
  background: var(--ps-panel-2); border-top: 1px solid var(--ps-border);
  font-size: 12.5px; color: var(--ps-muted); min-height: 32px;
}
.ps-statusbar .ps-mono { color: var(--ps-text); font-size: 12px; }
.ps-status-cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ps-status-hint { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ps-text); }
.ps-autosave[data-state="dirty"] { color: var(--ps-warning); }
.ps-autosave[data-state="error"] { color: var(--ps-danger); font-weight: 600; }
.ps-autosave[data-state="saved"] { color: var(--ps-ok); }
.ps-status-btn {
  height: 22px; padding: 0 8px; background: transparent; color: var(--ps-text);
  border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-sm); font-size: 12px; font-weight: 500;
}
.ps-status-btn:hover { background: var(--ps-hover); }
.ps-status-btn[aria-pressed="true"] { background: var(--ps-accent-soft); border-color: var(--ps-accent); color: var(--ps-accent); }

/* Modal and toasts ------------------------------------------------------------------ */
.ps-modal-root { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.ps-modal-root > * { pointer-events: auto; }
.ps-scrim {
  position: absolute; inset: 0; background: var(--ps-scrim);
  display: grid; place-items: center; padding: 16px;
}
.ps-modal {
  width: min(760px, 100%); max-height: min(640px, 100%);
  display: flex; flex-direction: column;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
  box-shadow: var(--ps-shadow);
}
.ps-modal--sm { width: min(420px, 100%); }
.ps-modal-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.ps-modal-head h2 { margin: 0; flex: 1; font-size: 18px; font-weight: 600; }
.ps-modal-body { padding: 0 16px 16px; overflow-y: auto; min-height: 0; }
.ps-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--ps-border); }
.ps-confirm {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between;
  margin-bottom: 12px; padding: 10px 12px;
  background: var(--ps-warning-soft); border: 1px solid var(--ps-warning); border-radius: var(--ps-radius);
}
.ps-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.ps-card {
  display: flex; flex-direction: column; gap: 4px; text-align: left;
  padding: 12px; min-height: 112px;
  background: var(--ps-field); border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
}
.ps-card:hover { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
.ps-card strong { font-size: 15px; font-weight: 600; }
.ps-card p { margin: 0; color: var(--ps-muted); font-size: 13px; flex: 1; }
.ps-card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.ps-tag {
  padding: 1px 7px; border: 1px solid var(--ps-border-strong); border-radius: 999px;
  font-family: var(--ps-font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ps-muted);
}
.ps-toasts {
  position: absolute; left: 50%; bottom: 44px; z-index: 60; transform: translateX(-50%);
  display: grid; gap: 6px; justify-items: center; width: min(520px, calc(100% - 24px)); pointer-events: none;
}
.ps-toast {
  pointer-events: auto; max-width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--ps-text); color: var(--ps-panel);
  border-radius: var(--ps-radius); box-shadow: var(--ps-shadow);
  animation: ps-toast-in 0.18s ease-out;
}
.ps-toast[data-kind="error"] { background: var(--ps-danger); color: var(--ps-on-status); }
.ps-toast[data-kind="warn"] { background: var(--ps-warning); color: var(--ps-on-status); }
.ps-toast[data-kind="ok"] { background: var(--ps-ok); color: var(--ps-on-status); }
.ps-toast button { background: transparent; border: 0; color: inherit; text-decoration: underline; padding: 0; }
@keyframes ps-toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Responsive ----------------------------------------------------------------------------- */
@media (max-width: 1399.98px) {
  .ps-btn .ps-btn-text { display: none; }
  .ps-btn:has(.ps-btn-text) { width: 32px; padding: 0; }
  .ps-btn--wide .ps-btn-text { display: inline; }
  .ps-btn--wide:has(.ps-btn-text) { width: auto; padding: 0 11px; }
  .ps-name { width: 150px; }
}
/* The 3D views add level tabs and a Roof toggle, so the file buttons go icon-only a little sooner there. */
@media (min-width: 1400px) and (max-width: 1599.98px) {
  .ps-shell .ps-btn .ps-btn-text { display: none; }
  .ps-shell .ps-btn:has(.ps-btn-text) { width: 32px; padding: 0; }
  .ps-shell .ps-btn--wide .ps-btn-text { display: inline; }
  .ps-shell .ps-btn--wide:has(.ps-btn-text) { width: auto; padding: 0 11px; }
}
@media (max-width: 899.98px) {
  #app { padding-block: 8px; }
  .ps-main { display: flex; flex-direction: column; position: relative; }
  .ps-stage { flex: 1 1 auto; order: 1; }
  .ps-toolbox {
    order: 2; flex: none; flex-direction: row; justify-content: flex-start;
    padding: 4px 6px; border-right: 0; border-top: 1px solid var(--ps-border);
    overflow-x: auto; overflow-y: hidden;
  }
  .ps-tool-sep { width: 1px; height: 28px; margin: 0 4px; }
  .ps-panel { order: 3; flex: none; border-left: 0; border-top: 1px solid var(--ps-border-strong); max-height: 52%; }
  .ps-sheet-toggle { display: inline-flex; }
  .ps-panel[data-open="false"] .ps-panel-body { display: none; }
  .ps-panel-head { padding: 4px 8px; }
  .ps-topbar { gap: 6px 8px; padding: 6px 8px; }
  .ps-product { display: none; }
  .ps-name { width: 130px; flex: 1 1 110px; }
  .ps-topbar-spacer { display: none; }
  .ps-field { grid-template-columns: 84px minmax(0, 1fr); }
  .ps-drawer { width: 100%; }
  .ps-statusbar { gap: 4px 12px; padding: 4px 8px; }
  .ps-status-hint { flex-basis: 100%; order: 9; }
  .ps-toasts { bottom: 90px; }
}
@media (max-width: 520px) {
  .ps-cell-cursor, .ps-autosave:not([data-state="error"]) { display: none; }
  .ps-level-tab, .ps-seg-btn { padding: 0 8px; }
  .ps-view-switch .ps-seg-btn { padding: 0 9px; }
}
@media (max-width: 599.98px) {
  .ps-view-switch .ps-seg-btn[data-view="split"] { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

/* Level chip menu ------------------------------------------------------------ */
.ps-chip-wrap { position: relative; display: inline-flex; }
.ps-chip-notes { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.ps-chip-btn { cursor: pointer; font: inherit; }
.ps-chip-btn:hover { background: var(--ps-hover); }
.ps-chip-btn[aria-expanded="true"] { border-color: var(--ps-accent); }
.ps-chip-btn svg { width: 12px; height: 12px; color: var(--ps-muted); }
.ps-level-menu {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 7;
  min-width: 200px; max-width: 280px; padding: 4px;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-lg);
  box-shadow: var(--ps-shadow);
}
.ps-menu-item {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px;
  background: transparent; border: 0; border-radius: var(--ps-radius-sm); text-align: left; color: var(--ps-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ps-menu-item:hover { background: var(--ps-hover); }
.ps-menu-item[aria-checked="true"] { color: var(--ps-accent); font-weight: 600; }
.ps-menu-tick { width: 14px; height: 14px; flex: none; display: inline-grid; place-items: center; }
.ps-menu-tick svg { width: 14px; height: 14px; }
.ps-menu-sep { height: 1px; margin: 4px 2px; background: var(--ps-border); }
.ps-menu-title { padding: 4px 6px 6px; font-family: var(--ps-font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ps-muted); }
.ps-level-menu .ps-input { margin: 0 0 6px; }
.ps-menu-actions { display: flex; justify-content: flex-end; gap: 6px; padding: 0 2px 2px; }

/* Presets, badges and small additions ----------------------------------------- */
.ps-field--chips { align-items: start; }
.ps-field--chips > .ps-field-label { padding-top: 4px; }
.ps-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.ps-chip {
  height: 24px; padding: 0 7px; background: var(--ps-field); color: var(--ps-text);
  border: 1px solid var(--ps-border-strong); border-radius: 999px;
  font-family: var(--ps-font-mono); font-size: 11.5px;
}
.ps-chip:hover { background: var(--ps-hover); }
.ps-chip[aria-pressed="true"] { background: var(--ps-accent); border-color: var(--ps-accent); color: var(--ps-accent-ink); }
.ps-badge {
  padding: 1px 6px; border-radius: 999px; background: var(--ps-accent-soft); color: var(--ps-accent);
  font-family: var(--ps-font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
}
.ps-btn--block { width: 100%; }
.ps-tool--wheel { margin-top: auto; }

/* Inventory wheel ------------------------------------------------------------- */
.ps-wheel-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20, 22, 26, 0.10); touch-action: none; }
.ps-wheel { position: absolute; pointer-events: none; }
.ps-wheel-svg { position: absolute; inset: 0; overflow: visible; filter: drop-shadow(0 6px 16px rgba(20, 22, 26, 0.22)); }
.ps-wheel-seg { fill: var(--ps-panel); stroke: var(--ps-border-strong); stroke-width: 1; transition: fill 0.08s; }
.ps-wheel-seg.is-active { fill: var(--ps-hover); }
.ps-wheel-seg.is-hover { fill: var(--ps-accent-soft); stroke: var(--ps-accent); stroke-width: 1.5; }
.ps-wheel-seg--slot { fill: var(--ps-panel-2); }
.ps-wheel-hub-bg { fill: var(--ps-panel); stroke: var(--ps-border-strong); stroke-width: 1; }
.ps-wheel-labels, .ps-wheel-fan { position: absolute; inset: 0; }
.ps-wheel-cat, .ps-wheel-slot {
  position: absolute; transform: translate(-50%, -50%); width: 66px; text-align: center;
  font-size: 11.5px; font-weight: 500; line-height: 1.1; color: var(--ps-text);
}
.ps-wheel-slot { width: 24px; height: 24px; display: grid; place-items: center; }
.ps-wheel-tile {
  position: absolute; transform: translate(-50%, -50%); width: 56px; height: 56px; display: grid; place-items: center;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: 50%;
  box-shadow: 0 3px 10px rgba(20, 22, 26, 0.20);
}
.ps-wheel-tile.is-hover { border-color: var(--ps-accent); background: var(--ps-accent-soft); transform: translate(-50%, -50%) scale(1.14); }
.ps-wheel-tile canvas { display: block; }
.ps-wheel-hub {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 74px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1px; pointer-events: none;
}
.ps-wheel-hub strong { font-size: 11.5px; font-weight: 600; line-height: 1.1; max-width: 70px; }
.ps-wheel-hub span { font-family: var(--ps-font-mono); font-size: 10px; color: var(--ps-muted); }

@media (max-width: 899.98px) {
  .ps-tool--wheel { margin-top: 0; }
}

/* Wheel slots (outer ring), hub, Inventory panel ----------------------------- */
.ps-wheel-cat { font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-wheel-slot { width: 40px; height: 40px; }
.ps-wheel-slot.is-empty { color: var(--ps-faint); opacity: 0.7; }
.ps-wheel-slot.is-off { opacity: 0.3; }
.ps-wheel-slot canvas { display: block; }
.ps-wheel-seg--slot { fill: var(--ps-panel); }
.ps-wheel-scrim[data-mode="walk"] { background: rgba(20, 22, 26, 0.28); }
.ps-modal--lg { width: min(900px, 100%); max-height: min(700px, 100%); }
.ps-inv { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; min-height: 0; }
.ps-inv-left { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.ps-inv-list { overflow-y: auto; max-height: 440px; padding-right: 4px; }
.ps-inv-group h4 { margin: 10px 0 4px; font-family: var(--ps-font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ps-muted); }
.ps-inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.ps-inv-item {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; min-height: 76px; padding: 6px 4px;
  background: var(--ps-panel-2); border: 1px solid var(--ps-border); border-radius: var(--ps-radius); color: var(--ps-text);
  font-size: 11.5px; line-height: 1.15; text-align: center; cursor: grab;
}
.ps-inv-item span { max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ps-inv-item:hover { border-color: var(--ps-accent); }
.ps-inv-item[aria-pressed="true"] { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
.ps-inv-item.is-used { box-shadow: inset 0 -3px 0 var(--ps-accent); }
.ps-inv-right { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ps-inv-wheel { position: relative; width: 300px; height: 300px; flex: none; }
.ps-inv-wheel::before { content: ''; position: absolute; left: 38px; top: 38px; right: 38px; bottom: 38px; border: 1px dashed var(--ps-border-strong); border-radius: 50%; }
.ps-inv-slot { position: absolute; width: 60px; height: 60px; transform: translate(-50%, -50%); }
.ps-inv-slot-btn {
  width: 100%; height: 100%; display: grid; place-items: center; border-radius: 50%;
  background: var(--ps-panel); border: 1.5px dashed var(--ps-border-strong); color: var(--ps-muted);
}
.ps-inv-slot.is-filled .ps-inv-slot-btn { border-style: solid; color: var(--ps-text); }
.ps-inv-slot-btn:hover, .ps-inv-slot-btn.is-over, .ps-inv-wheel.is-dragging .ps-inv-slot-btn { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
.ps-inv-slot-n { font-family: var(--ps-font-mono); font-size: 12px; }
.ps-inv-slot-x {
  position: absolute; right: -2px; top: -2px; width: 18px; height: 18px; display: grid; place-items: center; padding: 0;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: 50%; color: var(--ps-muted);
}
.ps-inv-slot-x:hover { color: var(--ps-danger); border-color: var(--ps-danger); }
.ps-inv-centre { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ps-muted); font-size: 12px; }
.ps-inv-hint { text-align: center; margin: 0; min-height: 36px; }
@media (max-width: 760px) { .ps-inv { grid-template-columns: minmax(0, 1fr); } .ps-inv-list { max-height: 240px; } }

/* Level tabs: delete cross on hover ------------------------------------------- */
.ps-level-tabwrap { position: relative; display: inline-flex; }
.ps-level-x {
  position: absolute; right: -5px; top: -6px; width: 16px; height: 16px; padding: 0; display: none; place-items: center;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: 50%; color: var(--ps-muted); z-index: 2;
}
.ps-level-tabwrap:hover .ps-level-x, .ps-level-tabwrap:focus-within .ps-level-x { display: grid; }
.ps-level-x:hover { color: var(--ps-danger); border-color: var(--ps-danger); background: var(--ps-danger-soft); }
@media (hover: none) { .ps-level-tabwrap .ps-level-x { display: none; } }
.ps-menu-item--danger { color: var(--ps-danger); }

/* Title block form -------------------------------------------------------------- */
.ps-tb-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.ps-tb-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ps-tb-field--wide { grid-column: 1 / -1; }
.ps-tb-field label { font-size: 12.5px; color: var(--ps-muted); }
.ps-tb-notes { height: auto; resize: vertical; padding-top: 6px; }
@media (max-width: 520px) { .ps-tb-form { grid-template-columns: minmax(0, 1fr); } }

.ps-logo-row { display: flex; gap: 12px; align-items: center; }
.ps-logo-preview { width: 140px; height: 64px; display: grid; place-items: center; border: 1px dashed var(--ps-border-strong); border-radius: 6px; background: var(--ps-panel); overflow: hidden; flex: none; }
.ps-logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.ps-logo-actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* Find my block (site lookup) --------------------------------------------------- */
.ps-find { position: relative; display: block; }
.ps-find-box { position: relative; display: flex; align-items: center; }
.ps-find-box svg { position: absolute; left: 8px; color: var(--ps-muted); pointer-events: none; }
.ps-find-input { padding-left: 30px; height: 34px; }
.ps-find-list {
  list-style: none; margin: 4px 0 0; padding: 4px; position: absolute; left: 0; right: 0; z-index: 20;
  background: var(--ps-panel); border: 1px solid var(--ps-border-strong); border-radius: var(--ps-radius-sm); box-shadow: var(--ps-shadow);
  max-height: 260px; overflow: auto;
}
.ps-find-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 4px; cursor: pointer; }
.ps-find-item[aria-selected="true"], .ps-find-item:hover { background: var(--ps-accent-soft, #e6ecfb); }
.ps-find-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-find-status { min-height: 18px; margin-top: 6px; font-size: 12.5px; color: var(--ps-muted); }
.ps-find-status[data-kind="warn"] { color: var(--ps-warning); }
.ps-find-mock { margin: 4px 0 0; }
.ps-find--compact .ps-find-input { height: 30px; }
.ps-welcome .ps-find { margin: 0 0 8px; }
.ps-scrim--top { place-items: start center; padding-top: min(9vh, 80px); }
.ps-modal--find { width: min(720px, 92vw); max-height: 80vh; }
.ps-modal--find .ps-modal-body { display: flex; flex-direction: column; min-height: 0; padding-bottom: 20px; }
.ps-find--large { display: flex; flex-direction: column; min-height: 0; }
.ps-find--large .ps-find-input { height: 56px; font-size: 18px; padding-left: 48px; }
.ps-find--large .ps-find-box svg { left: 15px; }
.ps-find--large .ps-find-list { position: static; margin: 8px 0 0; box-shadow: none; max-height: none; overflow: visible; flex: 1 1 auto; }
.ps-find--large .ps-find-item { min-height: 48px; padding: 0 12px; font-size: 15px; }
.ps-find-label { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-find-item .ps-tag { flex: none; }
.ps-find--large .ps-find-status { font-size: 14px; margin-top: 10px; }
@media (max-width: 599.98px) {
  .ps-scrim--top { padding: 0; place-items: stretch; }
  .ps-modal--find { width: 100%; max-height: 100%; height: 100%; border-radius: 0; }
}
.ps-site-facts { width: 100%; table-layout: fixed; }
.ps-site-facts td { overflow-wrap: anywhere; white-space: normal; }
.ps-site-facts td:first-child { width: 38%; overflow-wrap: normal; }
.ps-table.ps-site-facts td.num { white-space: normal; }
.ps-frontage {
  position: absolute; left: 50%; top: 14px; z-index: 6; transform: translateX(-50%);
  width: min(520px, calc(100% - 24px)); display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px;
  background: var(--ps-panel); border: 1px solid var(--ps-accent); border-radius: var(--ps-radius-lg); box-shadow: var(--ps-shadow);
}
.ps-frontage-chip {
  position: absolute; left: 12px; top: 12px; z-index: 6; display: inline-flex; align-items: center; gap: 2px; padding: 3px;
  background: var(--ps-panel); border: 1px solid var(--ps-accent); border-radius: 999px; box-shadow: var(--ps-shadow); font-size: 12.5px;
}
.ps-frontage-chip[hidden] { display: none; }
.ps-frontage-chip button { font: inherit; border: 0; background: transparent; color: var(--ps-text, inherit); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.ps-frontage-chip button:hover { background: rgba(0,0,0,.06); }
.ps-frontage-chip-done { background: var(--ps-accent) !important; color: #fff !important; }
.ps-frontage h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.ps-frontage-text { color: var(--ps-muted); font-size: 12.5px; }

/* Back stays labelled in every view (the 3D views shorten other buttons to icons); icon only on small screens. */
.ps-topbar .ps-back.ps-btn--wide .ps-btn-text { display: inline; }
@media (max-width: 899.98px) {
  .ps-topbar .ps-back.ps-btn--wide .ps-btn-text { display: none; }
  .ps-topbar .ps-back.ps-btn--wide:has(.ps-btn-text) { width: 32px; padding: 0; }
}
@media (max-width: 899.98px) {
  .ps-shell[data-view="split"] .ps3d-hints { display: none; }
}

/* First drag hint for Move house (shown once, no how-to panel) */
.ps-movehint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: var(--ps-panel); border: 1px solid var(--ps-border-strong); box-shadow: var(--ps-shadow); font-size: 12.5px; font-weight: 600; pointer-events: none; z-index: 5; }

/* Embed viewer mode (?embed=1 or ?view=viewer): the cinematic single lot 3D view only. See src/ui/embed-viewer.js. */
.ps-shell[data-embed-viewer] .ps-topbar,
.ps-shell[data-embed-viewer] .ps-toolbox,
.ps-shell[data-embed-viewer] .ps-panel,
.ps-shell[data-embed-viewer] .ps-statusbar,
.ps-shell[data-embed-viewer] .ps-hintbar,
.ps-shell[data-embed-viewer] .ps-backplan,
.ps-shell[data-embed-viewer] .ps-split-bar,
.ps-shell[data-embed-viewer] .ps-welcome,
.ps-shell[data-embed-viewer] .ps-drawer,
.ps-shell[data-embed-viewer] .ps3d-editbar { display: none !important; }
:root:has(.ps-shell[data-embed-viewer]) #app { padding: 0; }
.ps-shell[data-embed-viewer] { border: 0; border-radius: 0; grid-template-rows: minmax(0, 1fr); }
.ps-shell[data-embed-viewer] .ps-main { display: block; border-top: 0; min-height: 0; position: relative; }
.ps-shell[data-embed-viewer] .ps-stage { position: absolute; inset: 0; }
.ps-embed-full {
  position: absolute; top: 14px; right: 14px; z-index: 40; display: inline-flex; align-items: center; gap: 4px;
  height: 32px; padding: 0 14px; border-radius: 999px; text-decoration: none; font: 600 12.5px/1 var(--ps-font-ui, system-ui, sans-serif);
  color: #fff; background: rgba(14, 16, 20, 0.8); border: 1px solid rgba(255, 255, 255, 0.28);
}
.ps-shell[data-embed-viewer] .ps-embed-full { display: none; } /* Open full editor lives in the viewer menu */
.ps-embed-full:hover { background: rgba(14, 16, 20, 0.95); border-color: rgba(255, 255, 255, 0.5); }
.ps-embed-full:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.ps-embed-busy {
  position: absolute; left: 50%; top: 50%; z-index: 45; transform: translate(-50%, -50%); display: none; padding: 10px 18px; border-radius: 999px;
  font: 600 13px/1 var(--ps-font-ui, system-ui, sans-serif); color: #fff; background: rgba(14, 16, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.22);
}
.ps-shell[data-embed-busy] .ps-embed-busy { display: block; }

/* The full app: the same small card on a narrow window (the body stays open). */
@media (max-width: 1099.98px) {
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-card { width: min(360px, calc(100% - 24px)); padding: 10px 12px 0; bottom: 12px; border-radius: 12px; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-title { font-size: 20px; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-sub { margin-top: 3px; font-size: 11.5px; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-sub .lc-sc { display: none; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-stats { gap: 12px; margin: 6px 0 4px; flex-wrap: nowrap; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-stats b { font-size: 15px; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-stats i { margin-top: 2px; font-size: 8.5px; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-sp { margin: 3px 0; gap: 6px; align-items: center; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-sp > :not(.lc-k) { min-width: 0; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-sp .lc-k { width: 46px; font-size: 9px; padding-top: 0; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-strip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; zoom: 0.78; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-tab { height: 22px; padding: 0 8px !important; font-size: 10.5px; flex: none; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-btn { height: 28px; font-size: 11px; padding: 0 11px !important; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-acts { gap: 6px; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-fit { min-height: 22px; font-size: 11px; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-pager { left: 392px; transform: none; bottom: 12px; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-more { display: inline-block; position: relative; width: 28px; height: 28px; padding: 0 !important; font-size: 0; flex: none; }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-more::after { content: ''; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: translate(-50%, -75%) rotate(45deg); }
.lc-root:not(.lc-embed):not(.is-phone):not(.is-compact):not([data-view="2d"]):not([data-view="split"]) .lc-card.is-open .lc-more::after { transform: translate(-50%, -25%) rotate(-135deg); }
}

/* Commercial mode (Beta): the dock, the stats strip and the checks. */
.cm-dock { position: absolute; left: 12px; top: 12px; z-index: 6; width: 318px; max-height: calc(100% - 96px); overflow: auto; background: var(--ps-panel); color: var(--ps-text); border: 1px solid var(--ps-border-strong, var(--ps-border)); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px 12px 12px; font: 13px/1.35 var(--ps-font-ui, system-ui, sans-serif); }
.cm-dock[hidden], .cm-strip[hidden] { display: none; }
.cm-head { display: grid; gap: 4px; margin-bottom: 8px; }
.cm-title { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.cm-beta { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; background: #c7a256; color: #1a1c20; font-weight: 700; }
.cm-sub { color: var(--ps-muted); font-size: 12px; }
.cm-rows { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.cm-chip { border: 1px solid var(--ps-border-strong, #c9ccd2); background: var(--ps-panel-2); color: inherit; border-radius: 8px; padding: 4px 9px; cursor: pointer; font: inherit; display: grid; text-align: left; }
.cm-chip i { font-style: normal; font-size: 11px; color: var(--ps-muted); }
.cm-chip[aria-selected="true"] { border-color: #c7a256; box-shadow: inset 0 0 0 1px #c7a256; }
.cm-actions { display: flex; gap: 6px; margin-bottom: 8px; }
.cm-btn { flex: 1; border: 1px solid var(--ps-border-strong, #c9ccd2); background: var(--ps-panel-2); color: inherit; border-radius: 8px; padding: 5px 6px; font: inherit; cursor: pointer; }
.cm-btn:disabled { opacity: .45; cursor: default; }
.cm-danger { color: var(--ps-danger, #b52828); }
.cm-field { display: grid; grid-template-columns: 1fr 118px; gap: 8px; align-items: center; margin: 5px 0; }
.cm-field .cm-hint { grid-column: 1 / -1; }
.cm-field.cm-stack { grid-template-columns: 1fr; gap: 3px; }
.cm-dock input:disabled, .cm-dock select:disabled { opacity: .55; }
.cm-l { color: var(--ps-text); }
.cm-in { display: flex; align-items: center; gap: 4px; }
.cm-in i { font-style: normal; color: var(--ps-muted); font-size: 11px; min-width: 20px; }
.cm-dock input[type="number"], .cm-dock select { width: 100%; box-sizing: border-box; font: inherit; padding: 4px 6px; border: 1px solid var(--ps-border-strong, #c9ccd2); border-radius: 6px; background: var(--ps-panel); color: inherit; }
.cm-chk { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin: 5px 0; }
.cm-chk .cm-hint { color: var(--ps-muted); font-size: 11.5px; flex-basis: 100%; padding-left: 24px; }
.cm-hint { color: var(--ps-muted); font-size: 11.5px; }
.cm-sec { border-top: 1px solid var(--ps-border, #e1e3e7); padding: 6px 0 2px; }
.cm-sec > summary { cursor: pointer; font-weight: 600; padding: 3px 0; }
.cm-line { display: flex; justify-content: space-between; gap: 8px; margin: 3px 0; }
.cm-fz-caveat { margin: 2px 0 6px; font-weight: 600; color: var(--ps-text); }
.cm-fz-in { margin-bottom: 6px; }
.cm-fz-chip { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; }
.cm-chip2 { font-size: 10.5px; line-height: 1.25; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--ps-border-strong, #c9ccd2); color: var(--ps-muted); background: var(--ps-panel-2); }
.cm-chip-portal { border-color: #5b8a5f; color: #2f6a35; }
.cm-chip-edited { border-color: #c7a256; color: #8a6a1f; }
.cm-link { border: 0; background: none; padding: 0; font: inherit; font-size: 11px; color: #8a6a1f; text-decoration: underline; cursor: pointer; }
.cm-fz-h { display: block; margin: 10px 0 3px; }
.cm-fz-out { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 4px 0; border-top: 1px solid var(--ps-border, #e1e3e7); }
.cm-fz-out b { text-align: right; }
.cm-fz-out i { grid-column: 1 / -1; font-style: normal; font-size: 11px; color: var(--ps-muted); }
.cm-fz-total { font-weight: 600; border-top: 1px solid var(--ps-border-strong, #c9ccd2); }
.cm-fz-units { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.cm-fz-units th, .cm-fz-units td { text-align: right; padding: 2px 3px; border-bottom: 1px solid var(--ps-border, #e1e3e7); }
.cm-fz-units th:first-child, .cm-fz-units td:first-child { text-align: left; }
.cm-checks { border-top: 1px solid var(--ps-border, #e1e3e7); margin-top: 6px; padding-top: 8px; display: grid; gap: 6px; }
.cm-check { margin: 0; padding: 6px 8px; border-radius: 8px; background: var(--ps-panel-2); font-size: 12.5px; }
.cm-check.cm-warn { background: rgba(147,88,0,.13); border-left: 3px solid var(--ps-warning, #935800); }
.cm-check.cm-info { border-left: 3px solid #c7a256; }
.cm-strip { position: absolute; left: 342px; bottom: 14px; z-index: 6; display: flex; gap: 0; background: var(--ps-panel); border: 1px solid var(--ps-border-strong, #c9ccd2); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.16); overflow: hidden; max-width: calc(100% - 356px); }
.cm-cell { padding: 8px 14px; display: grid; gap: 1px; border-right: 1px solid var(--ps-border, #e1e3e7); min-width: 84px; align-content: start; }
.cm-cell:last-child { border-right: 0; }
.cm-cell b { font-size: 17px; color: var(--ps-text); white-space: nowrap; }
.cm-cell i { font-style: normal; font-size: 11px; color: var(--ps-muted); max-width: 150px; overflow-wrap: anywhere; }
/* 3D and walk: the dock steps aside so the model is clear, and the strip moves to the top between the view buttons. */
.ps-shell:is([data-view="3d"],[data-view="walk"]) .cm-dock { display: none; }
.ps-shell:is([data-view="3d"],[data-view="walk"]) .cm-strip { top: 12px; bottom: auto; left: 176px; max-width: calc(100% - 370px); overflow-x: auto; }
/* The "Map data" chip sits above the strip, not on it. */
.ps-shell .ps-stage[data-commercial="1"] .ps-credit { bottom: 112px; }
.ps-shell:is([data-view="3d"],[data-view="walk"]) .ps-stage[data-commercial="1"] .ps-credit { bottom: 50px; }
.cm-short { display: none; }
.cm-sheet-toggle { display: none; margin-left: auto; border: 1px solid var(--ps-border-strong, #c9ccd2); background: var(--ps-panel-2); color: inherit; border-radius: 8px; padding: 3px 12px; font: inherit; font-weight: 600; cursor: pointer; }
/* Phone width: the dock is a bottom sheet that collapses to its title bar, and the strip runs along the top of the plan, so neither covers the other or the Demo tips chip. */
@media (max-width: 899.98px) {
  .cm-dock { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 58%; border-radius: 14px 14px 0 0; border-bottom: 0; padding-bottom: 14px; box-shadow: 0 -6px 24px rgba(0,0,0,.18); }
  .cm-dock::before { content: ''; display: block; width: 36px; height: 4px; border-radius: 4px; background: var(--ps-border-strong, #c9ccd2); margin: 0 auto 8px; }
  .cm-sheet-toggle { display: inline-block; }
  .cm-full { display: none; }
  .cm-short { display: inline; }
  .cm-dock[data-sheet="closed"] { overflow: hidden; max-height: none; padding-bottom: 8px; }
  .cm-dock[data-sheet="closed"] > :not(.cm-head) { display: none; }
  .cm-dock[data-sheet="closed"] .cm-head { margin-bottom: 0; }
  .cm-dock[data-sheet="closed"] .cm-head > :not(.cm-title) { display: none; }
  .ps-shell:is([data-view="3d"],[data-view="walk"]) .cm-strip { left: 8px; right: 8px; max-width: none; }
  .cm-strip { left: 8px; right: 8px; top: 8px; bottom: auto; transform: none; max-width: none; overflow-x: auto; border-radius: 10px; }
  .cm-cell { padding: 5px 10px; min-width: 64px; flex: none; }
  .cm-cell b { font-size: 14px; }
  .cm-cell i { font-size: 10px; max-width: 110px; }
  .ps-stage[data-commercial="1"] .ps-credit { bottom: 62px; }
  .ps-stage[data-commercial="1"] .pso-dock { bottom: 62px; }
  .ps-stage[data-commercial="1"][data-sheet="open"] .pso-dock, .ps-stage[data-commercial="1"][data-sheet="open"] .ps-credit { display: none; }
}

</style>

.lc-root.is-compact .lc-pager button{width:32px;height:32px;line-height:30px}
.lc-root.is-compact .lc-pgt{min-width:0;max-width:120px;font-size:9.5px}
/* In a room view the card folds to its header and the room pills so it never covers the view. */
.lc-root[data-room="1"]:not(.is-compact) .lc-card :is(.lc-stats,.lc-sp:not(.lc-sp-rooms),.lc-acts,.lc-fit){display:none}
.lc-compact.lc-on .ps3d-viewbar{top:auto;bottom:170px;left:12px;transform:none}
.lc-compact.lc-on .ps3d-hints{display:none}
.lc-mini-hint{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font:500 9px var(--lc-sans);color:#fff;background:rgba(10,10,12,.72);text-align:center;opacity:0;pointer-events:none;transition:opacity .15s}
.lc-mini:hover .lc-mini-hint{opacity:1}
@media (hover:none){.lc-mini-hint{display:none}}
.lc-mini.is-big{width:min(44vw,460px);min-width:0;z-index:5}
@media (max-width:640px){.lc-plan{width:110px;height:74px}.lc-stats{gap:10px}.lc-btn{height:34px;padding:0 12px!important}}
@media (prefers-reduced-motion:no-preference){.lc-chip,.lc-btn{transition:background .15s,box-shadow .15s}}
/* Embedded viewer (the home page frame): the Lot Planner layout. Tag and compass top left, address search and menu top right, the design card
   bottom left, the design switcher bottom centre, the top view bottom right, microtext along the bottom. */
.lc-embed .lc-head{left:14px;top:14px;max-width:calc(100% - 430px);padding:10px 14px 11px;border-radius:12px;background:rgba(10,10,12,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-shadow:none}
.lc-embed .lc-head-t{font-size:13px;letter-spacing:.26em}
.lc-embed .lc-head-s{margin-top:7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-compass{position:absolute;left:14px;top:72px;width:38px;height:38px;border-radius:50%;display:flex!important;align-items:center;justify-content:center}
.lc-compass svg{width:26px;height:26px}
.lc-compass:hover,.lc-menu:hover{background:rgba(40,40,46,.85)}
.lc-embed .lc-find{right:64px;top:14px;height:42px;width:min(340px,calc(100% - 520px));max-width:none;padding:0 16px!important;border-radius:21px;gap:10px}
.lc-embed .lc-find-in{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--lc-t1);font:500 13.5px var(--lc-sans);padding:0}
.lc-embed .lc-find-in::placeholder{color:var(--lc-t1);opacity:.92}
.lc-embed .lc-find:focus-within{border-color:rgba(255,255,255,.55)}
.lc-find-list{position:absolute;left:0;right:0;top:48px;margin:0;padding:6px;list-style:none;border-radius:14px;max-height:280px;overflow:auto;z-index:6}
.lc-find-list[hidden]{display:none}
.lc-find-item{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font:500 12.5px var(--lc-sans)}
.lc-find-item i{font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--lc-t2)}
.lc-find-item:hover,.lc-find-item[aria-selected=true]{background:rgba(255,255,255,.14)}
.lc-menu{position:absolute;right:14px;top:14px;width:42px;height:42px;border-radius:50%;display:flex!important;align-items:center;justify-content:center}
.lc-menu-list{position:absolute;right:14px;top:62px;width:230px;padding:6px;border-radius:14px;z-index:7;display:flex;flex-direction:column}
.lc-menu-list[hidden]{display:none}
.lc-menu-item{text-align:left;padding:10px 12px!important;border-radius:9px;font:500 13px var(--lc-sans)}
.lc-menu-item:hover{background:rgba(255,255,255,.14)}
.lc-foot{position:absolute;left:16px;bottom:6px;font:400 9.5px/1 var(--lc-sans);letter-spacing:.02em;color:rgba(255,255,255,.62);text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none}
.lc-embed:not(.is-compact) .lc-card{left:14px;bottom:26px;width:clamp(380px,calc(50% - 168px),590px);padding:20px 24px 0;border-radius:16px}
.lc-embed:not(.is-compact) .lc-stats{gap:18px;margin:12px 0 8px}
.lc-embed:not(.is-compact) .lc-stats b{font-size:25px}
.lc-embed:not(.is-compact) .lc-sp{margin:6px 0 8px}
.lc-embed:not(.is-compact) .lc-sp .lc-k{width:62px}
.lc-embed:not(.is-compact) .lc-sp-rooms .lc-tabs{flex-wrap:wrap}
.lc-embed:not(.is-compact) .lc-tab{height:32px;padding:0 15px!important;font-size:13px}
.lc-embed:not(.is-compact) .lc-acts{gap:8px 10px}
.lc-embed:not(.is-compact) .lc-gh{padding:0 4px!important}
.lc-embed:not(.is-compact) .lc-fit{min-height:40px;margin-top:2px;font-size:12.5px}
.lc-embed:not(.is-compact) .lc-pager{left:50%;right:auto;transform:translateX(-50%);width:auto;bottom:26px;justify-content:center}
.lc-embed:not(.is-compact) .lc-pgt{min-width:150px;max-width:300px;flex:none;font-size:10.5px;letter-spacing:.16em}
.lc-embed:not(.is-compact) .lc-mini{bottom:26px;right:14px;width:min(18%,200px)}
.lc-embed.is-compact .lc-find{display:flex;left:12px;right:62px;top:12px;width:auto;height:40px}
.lc-embed.is-compact .lc-menu{right:12px;top:12px;width:40px;height:40px}
.lc-embed.is-compact .lc-menu-list{top:58px;right:12px}
.lc-embed.is-compact .lc-head{left:12px;top:60px;max-width:calc(100% - 130px);padding:7px 10px 8px}
.lc-embed.is-compact .lc-head-t{font-size:11px}
.lc-embed.is-compact .lc-compass{left:12px;top:104px;width:34px;height:34px}
.lc-embed.is-compact .lc-rooms{top:150px}
.lc-embed.is-compact .lc-find-list{top:46px}
.lc-embed.is-phone .lc-foot{display:none}
.lc-embed.is-compact .lc-foot{left:12px;bottom:3px}
.lc-embed.is-compact .lc-card .lc-gh{padding:0 6px!important}
/* The two PDF links share one row. */
.lc-zone{margin-top:4px;padding:6px 10px;border-radius:8px;background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.45);color:#ffd68a;font:500 11.5px var(--lc-sans)}.lc-zone[hidden]{display:none}
.lc-links{display:inline-flex;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.lc-dotsep{color:var(--lc-t2);padding:0 2px}
.lc-links .lc-gh{padding:0 4px!important}
/* Busy states: the pager while a design is placed, the search pill while an address loads. */
.lc-pager.is-busy{opacity:.78}
.lc-pager.is-busy button{cursor:progress}
.lc-find.is-busy{opacity:.8}
/* Phone and compact: the switcher rides just above the card (open or closed) so it is never hidden or covered; the room pills fade at a clipped edge. */
.lc-embed.is-compact .lc-pager{bottom:calc(var(--lc-card-h, 100px) + 12px)}
.lc-embed.is-compact:has(.lc-card.is-open) .lc-pager:not([hidden]){display:flex}
.lc-embed.is-compact .lc-rooms .lc-tabs{scrollbar-width:none;padding-right:2px}
.lc-embed.is-compact .lc-rooms .lc-tabs::-webkit-scrollbar{display:none}
.lc-embed.is-compact .lc-rooms .lc-tabs.has-more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.lc-embed.is-compact .lc-rooms .lc-tabs.has-more.has-less{-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 36px),transparent)}
.lc-embed.is-compact .lc-rooms .lc-tabs.has-less:not(.has-more){-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px);mask-image:linear-gradient(90deg,transparent,#000 24px)}
/* Send the plans to a registered engineer: a clear button under the PDF links (desktop and phone). */
.lc-send{margin-top:8px}.lc-send[hidden],.lc-sendbtn[hidden]{display:none}
.lc-sendbtn{border-color:rgba(255,200,61,.75)!important;color:#ffd77a!important;height:38px}
.lc-sendbtn:hover{background:rgba(255,200,61,.14)}
.lc-root.is-phone .lc-send{margin-top:6px}.lc-root.is-phone .lc-sendbtn{width:100%;white-space:normal;line-height:1.15;height:auto;min-height:36px;padding:6px 12px!important}
.lc-root[data-room="1"]:not(.is-compact) .lc-card .lc-send{display:none}
.ps-toast button{white-space:normal}
